<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>마음을 줍는 로봇 — 아트톤 A (픽사풍 따뜻)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family:'Quicksand','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:#2a1f1a; display:flex; justify-content:center; align-items:center;
    color:#5b4636; user-select:none;
  }
  /* 세로형 모바일 프레임 */
  #app {
    position:relative; width:100%; max-width:420px; height:100%; max-height:880px;
    overflow:hidden; background:linear-gradient(#fff3df 0%, #ffe2bb 42%, #ffd0a3 70%, #ffc59c 100%);
    box-shadow:0 24px 80px rgba(0,0,0,.5);
  }

  /* 태양 글로우 */
  .sun { position:absolute; top:-60px; right:-40px; width:240px; height:240px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,247,224,.95), rgba(255,236,190,.5) 45%, transparent 70%);
    pointer-events:none; }

  /* 배경 언덕 (패럴랙스 드리프트) */
  .hills { position:absolute; left:0; bottom:0; width:300%; height:60%; pointer-events:none; }
  .hill { position:absolute; bottom:0; border-radius:50% 50% 0 0; }
  .h1 { width:60%; height:55%; left:0;   background:#ffcaa0; animation:drift 26s linear infinite; }
  .h2 { width:55%; height:72%; left:38%; background:#f4ad6e; animation:drift 20s linear infinite; }
  .h3 { width:65%; height:48%; left:72%; background:#e89455; animation:drift 14s linear infinite; }
  @keyframes drift { from{transform:translateX(0)} to{transform:translateX(-33.33%)} }

  /* 땅 */
  .ground { position:absolute; left:0; bottom:0; width:100%; height:24%;
    background:linear-gradient(#e89455,#d77f43); }
  .road { position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:62%; height:24%; background:linear-gradient(#caa06e,#b98a52);
    clip-path:polygon(42% 0,58% 0,100% 100%,0 100%); opacity:.6; }
  /* 길 위 작은 풀/돌 흘러가기 */
  .deco { position:absolute; bottom:14%; font-size:20px; opacity:.7; animation:pass 6s linear infinite; }
  @keyframes pass { from{ transform:translateX(440px) scale(.6); opacity:0 }
    20%{opacity:.8} to{ transform:translateX(-60px) scale(1.2); opacity:0 } }

  /* 만나는 사람 */
  .person { position:absolute; bottom:24%; left:74%; transform:translateX(-50%);
    text-align:center; transition:opacity .6s, transform .6s; }
  .person svg { display:block; filter:drop-shadow(0 6px 10px rgba(120,70,30,.25)); }

  /* 로봇 */
  .robot-wrap { position:absolute; bottom:23%; left:34%; transform:translateX(-50%);
    --p:0; animation:bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-10px)} }
  .robot { width:150px; height:auto; overflow:visible; }
  .robot .aura { fill:#ffd98a; opacity:calc(var(--p)*.55); transition:opacity .8s; }
  .robot .shadow { fill:rgba(120,70,30,.22); }
  .robot .body { fill:#f7efe1; stroke:#e9d9c0; stroke-width:3; }
  .robot .head { fill:#fbf5ea; stroke:#e9d9c0; stroke-width:3; }
  .robot .limb { fill:#d9c8ac; }
  .robot .part { fill:#cdb993; }
  .robot .face { fill:#3a4a55; }
  .robot .eye  { fill:#8fd3ff; transition:fill .8s;
    /* 마음이 따뜻해질수록 눈빛이 따뜻해짐 */ }
  .robot[style] .eye { fill:color-mix(in srgb,#8fd3ff calc((1 - var(--p))*100%),#ffd27a); }
  .robot .core { fill:#7fd0c8; opacity:calc(.35 + var(--p)*.65); transition:opacity .8s; }
  .robot .core-inner { fill:#fff; opacity:calc(var(--p)*.9); }
  .robot .antenna { stroke:#cdb993; stroke-width:4; stroke-linecap:round; }
  .robot .antenna-tip { fill:#ff8a6b; }
  .robot .cheek { fill:#ff9e7d; opacity:calc(var(--p)*.7); }

  /* 떠오르는 감정 입자 */
  .mote { position:absolute; width:16px; height:16px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle,#fff,#ffd27a 60%,transparent);
    animation:rise 1.1s ease-out forwards; }
  @keyframes rise { 0%{transform:translate(-50%,-50%) scale(.4); opacity:0}
    20%{opacity:1} 100%{transform:translate(-50%,-180px) scale(1.1); opacity:0} }

  /* 상단 HUD */
  .hud { position:absolute; top:0; left:0; right:0; padding:16px 18px 10px;
    display:flex; flex-direction:column; gap:8px; z-index:5; }
  .titlebar { display:flex; justify-content:space-between; align-items:baseline; }
  .title { font-weight:700; font-size:18px; color:#7a4f30; letter-spacing:-.3px; }
  .tone { font-size:11px; font-weight:600; color:#b07b4e; background:#fff5e6;
    padding:3px 9px; border-radius:20px; }
  .warm { font-size:12px; font-weight:600; color:#a9703f; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:11px; font-weight:700; background:#fff5e6; color:#c06a3a;
    padding:4px 10px; border-radius:20px; box-shadow:0 2px 0 rgba(192,106,58,.12); animation:pop .4s ease; }
  @keyframes pop { from{transform:scale(.4); opacity:0} to{transform:scale(1); opacity:1} }

  /* 만남 자막 */
  .caption { position:absolute; left:18px; right:18px; bottom:22%; z-index:4;
    background:rgba(255,255,255,.82); backdrop-filter:blur(4px);
    border-radius:18px; padding:13px 16px; font-size:14px; font-weight:600; color:#6b4a30;
    line-height:1.5; box-shadow:0 8px 24px rgba(150,90,40,.18); transition:opacity .5s; }
  .caption b { color:#d2733a; }

  /* 하단 안내 */
  .hint { position:absolute; left:0; right:0; bottom:5%; text-align:center; z-index:4;
    font-size:13px; font-weight:600; color:#9a6a3e; animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }

  /* 마음 게이지 */
  .meter { position:absolute; left:18px; right:18px; bottom:13%; height:14px; z-index:4;
    background:rgba(255,255,255,.55); border-radius:20px; overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(150,90,40,.2); }
  .meter > i { display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#ffcaa0,#ff9e7d,#ff8a6b); border-radius:20px;
    transition:width .18s ease; }

  /* 일기 카드 */
  .diary { position:absolute; inset:0; z-index:20; display:none;
    align-items:center; justify-content:center; padding:26px;
    background:rgba(60,35,20,.55); backdrop-filter:blur(3px); }
  .diary.show { display:flex; animation:fade .4s ease; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .card { width:100%; max-width:330px; background:linear-gradient(#fffaf2,#fff1de);
    border-radius:26px; padding:26px 24px 22px; text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.4); animation:risein .5s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes risein { from{transform:translateY(40px) scale(.9); opacity:0} to{transform:none; opacity:1} }
  .card .badge { font-size:12px; font-weight:700; color:#c06a3a; letter-spacing:1px; }
  .card .emo { font-size:30px; font-weight:700; color:#d2733a; margin:6px 0 14px; }
  .card .log { font-family:'Gaegu',cursive; font-size:19px; line-height:1.7; color:#5b4636;
    text-align:left; white-space:pre-line; }
  .card button { margin-top:22px; width:100%; padding:14px; border:none; border-radius:18px;
    font-family:inherit; font-weight:700; font-size:15px; color:#fff; cursor:pointer;
    background:linear-gradient(#ff9e7d,#ff8159); box-shadow:0 6px 0 #e96c45; transition:transform .1s; }
  .card button:active { transform:translateY(4px); box-shadow:0 2px 0 #e96c45; }
</style>
</head>
<body>
<div id="app">
  <div class="sun"></div>
  <div class="hills">
    <div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div>
  </div>
  <div class="ground"></div>
  <div class="road"></div>
  <div class="deco" style="animation-delay:0s">🌿</div>
  <div class="deco" style="animation-delay:2.4s">🪨</div>
  <div class="deco" style="animation-delay:4.1s">🌼</div>

  <div class="hud">
    <div class="titlebar">
      <div class="title">마음을 줍는 로봇 <span style="font-size:12px;color:#b07b4e">(가제)</span></div>
      <div class="tone">아트톤 A · 픽사풍</div>
    </div>
    <div class="warm">🔥 마음 온도 <span id="warmPct">0</span>%</div>
    <div class="chips" id="chips"></div>
  </div>

  <!-- 만나는 사람 -->
  <div class="person" id="person">
    <svg width="78" height="120" viewBox="0 0 78 120">
      <ellipse cx="39" cy="114" rx="26" ry="6" fill="rgba(120,70,30,.22)"/>
      <rect x="20" y="48" width="38" height="58" rx="18" id="pBody" fill="#c98fb0"/>
      <circle cx="39" cy="34" r="20" fill="#ffe0c0"/>
      <path d="M19 30 a20 20 0 0 1 40 0 v-4 a20 20 0 0 0 -40 0z" id="pHair" fill="#7a5a48"/>
    </svg>
  </div>

  <!-- 로봇 -->
  <div class="robot-wrap" id="robotWrap" style="--p:0">
    <svg class="robot" viewBox="0 0 220 270">
      <circle class="aura" cx="110" cy="150" r="96"/>
      <ellipse class="shadow" cx="110" cy="256" rx="54" ry="11"/>
      <rect class="limb" x="44" y="124" width="15" height="64" rx="7"/>
      <rect class="limb" x="161" y="124" width="15" height="64" rx="7"/>
      <rect class="limb" x="86" y="200" width="15" height="38" rx="7"/>
      <rect class="limb" x="119" y="200" width="15" height="38" rx="7"/>
      <ellipse class="part" cx="88" cy="240" rx="17" ry="9"/>
      <ellipse class="part" cx="132" cy="240" rx="17" ry="9"/>
      <rect class="body" x="62" y="120" width="96" height="96" rx="34"/>
      <circle class="core" cx="110" cy="166" r="19"/>
      <circle class="core-inner" cx="110" cy="166" r="9"/>
      <rect class="head" x="68" y="44" width="84" height="74" rx="32"/>
      <rect class="face" x="80" y="58" width="60" height="44" rx="20"/>
      <circle class="eye" cx="100" cy="80" r="7.5"/>
      <circle class="eye" cx="124" cy="80" r="7.5"/>
      <circle class="cheek" cx="88" cy="92" r="6"/>
      <circle class="cheek" cx="136" cy="92" r="6"/>
      <line class="antenna" x1="110" y1="44" x2="110" y2="24"/>
      <circle class="antenna-tip" cx="110" cy="20" r="6"/>
    </svg>
  </div>

  <div class="caption" id="caption"></div>
  <div class="meter"><i id="meterFill"></i></div>
  <div class="hint" id="hint">화면을 톡톡 두드려 이 순간을 <b>느껴보세요</b> 💛</div>

  <div class="diary" id="diary">
    <div class="card">
      <div class="badge">새로운 감정을 깨달았다</div>
      <div class="emo" id="cardEmo"></div>
      <div class="log" id="cardLog"></div>
      <button id="nextBtn">다음 길로 떠나기 →</button>
    </div>
  </div>
</div>

<script>
const EMOTIONS = [
  { name:"그리움", color:"#c98fb0", hair:"#7a5a48",
    situation:"버스 정류장. 한 사람이 떠나고, <b>남은 이가 손을 오래 흔든다.</b>",
    log:"오늘 한 사람이 떠나는 걸 보았다.\n남은 사람은 버스가 사라진 뒤에도\n한참을 손 흔들었다.\n\n나는 '그리움'이라는 데이터를 얻었다.\n— 곁에 없어도 자꾸 떠오르는 것.\n\n나는… 누구를 그리워하게 될까." },
  { name:"슬픔", color:"#8fb0c9", hair:"#3a3a3a",
    situation:"길가에서 <b>한 아이가 울고 있다.</b> 눈에서 물이 흐른다.",
    log:"아이의 눈에서 물이 흘렀다.\n처음엔 고장인 줄 알았다.\n\n곁에 가만히 앉아 있었더니\n내 가슴 어딘가도 무거워졌다.\n\n이게… '슬픔'이구나." },
  { name:"온기", color:"#e0a86a", hair:"#5a4030",
    situation:"낯선 이가 말없이 <b>따뜻한 빵을 건넨다.</b> 그리고 웃는다.",
    log:"낯선 이가 내게 따뜻한 빵을 건넸다.\n이유를 묻자 그냥 웃기만 했다.\n\n받을 자격을 계산하던 회로가\n조용히 멈췄다.\n\n이게 '온기'인가 보다." },
  { name:"용기", color:"#9bc98f", hair:"#4a4a2a",
    situation:"무너진 다리 앞. 한 사람이 <b>떨리는 손으로 첫발</b>을 내딛는다.",
    log:"그 사람의 손은 떨리고 있었다.\n그런데도 발을 내디뎠다.\n\n두려움이 0이 되어서가 아니라\n두려움을 안고도 가는 것 —\n\n그걸 '용기'라 부른다고 적어둔다." },
];

let idx = 0, fill = 0, unlocked = 0;
const NEED = 10;
const app = document.getElementById('app');
const meterFill = document.getElementById('meterFill');
const caption = document.getElementById('caption');
const robotWrap = document.getElementById('robotWrap');
const chips = document.getElementById('chips');
const warmPct = document.getElementById('warmPct');
const diary = document.getElementById('diary');
const hint = document.getElementById('hint');

function loadScene() {
  const e = EMOTIONS[idx];
  caption.innerHTML = "🚶 " + e.situation;
  document.getElementById('pBody').setAttribute('fill', e.color);
  document.getElementById('pHair').setAttribute('fill', e.hair);
  caption.style.opacity = 1;
  hint.style.opacity = '';
}

function feel(x, y) {
  if (diary.classList.contains('show')) return;
  if (fill >= NEED) return;
  fill++;
  meterFill.style.width = (fill / NEED * 100) + '%';
  const m = document.createElement('div');
  m.className = 'mote';
  m.style.left = x + 'px'; m.style.top = y + 'px';
  app.appendChild(m);
  setTimeout(() => m.remove(), 1100);
  // 두드릴 때 로봇 살짝 반응
  robotWrap.style.transition = 'transform .1s';
  if (fill >= NEED) unlock();
}

function unlock() {
  const e = EMOTIONS[idx];
  unlocked++;
  const p = Math.min(unlocked / EMOTIONS.length, 1);
  robotWrap.style.setProperty('--p', p);
  warmPct.textContent = Math.round(p * 100);
  const chip = document.createElement('div');
  chip.className = 'chip'; chip.textContent = '✦ ' + e.name;
  chips.appendChild(chip);
  document.getElementById('cardEmo').textContent = '「 ' + e.name + ' 」';
  document.getElementById('cardLog').textContent = e.log;
  caption.style.opacity = 0; hint.style.opacity = 0;
  setTimeout(() => diary.classList.add('show'), 300);
}

document.getElementById('nextBtn').addEventListener('click', () => {
  diary.classList.remove('show');
  idx = (idx + 1) % EMOTIONS.length;
  fill = 0; meterFill.style.width = '0%';
  loadScene();
});

app.addEventListener('pointerdown', (ev) => {
  const r = app.getBoundingClientRect();
  feel(ev.clientX - r.left, ev.clientY - r.top);
});

loadScene();
</script>
</body>
</html>
