<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>새 탭</title>
    <style>
      /* newtab.js가 모드를 정하기 전까지 본문을 숨겨 깜빡임을 줄인다.
         (배경은 게임과 같은 종이색이라 잠깐 비어도 어색하지 않음) */
      html, body { height: 100%; margin: 0; background: #f6f3ec; }
      body { display: none; }
      .wrap {
        height: 100%;
        display: grid;
        place-content: center;
        gap: 14px;
        text-align: center;
        font-family: system-ui, "Segoe UI", sans-serif;
        color: #3a3a44;
      }
      .robot { font-size: 56px; }
      .t { font-size: 15px; letter-spacing: 1px; }
      .d { font-size: 12px; color: #9a958c; }
      .btns { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
      button {
        border: 1px solid #d8d2c6;
        background: #fff;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 12px;
        color: #3a3a44;
        cursor: pointer;
      }
      button.primary { background: #2f9e8f; color: #fff; border-color: #2f9e8f; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="robot">🐕</div>
      <div class="t">강아지 산책</div>
      <div class="d">사이드패널 모드 — 강아지는 옆 패널에서 산책 중</div>
      <div class="btns">
        <button id="open" class="primary">▶ 옆 패널 열기</button>
        <button id="toTab">새 탭에 게임 띄우기</button>
      </div>
    </div>
    <script src="newtab.js"></script>
  </body>
</html>
