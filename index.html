<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI인간 — MVP 프로토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family:'Nanum Myeongjo','Apple SD Gothic Neo','Batang',serif;
    background:#1c1d1a; display:flex; justify-content:center; align-items:center;
    color:#5a5750; user-select:none;
  }
  #app {
    position:relative; width:100%; max-width:420px; height:100%; max-height:880px;
    overflow:hidden; background:#f3efe6; box-shadow:0 24px 80px rgba(0,0,0,.5);
    display:flex; flex-direction:column;
  }
  #app::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.5; mix-blend-mode:multiply; z-index:1;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>"); }
  svg.defs { position:absolute; width:0; height:0; }

  /* ---------- HUD ---------- */
  .hud { position:relative; z-index:6; padding:7px 16px 6px; flex:0 0 auto;
    background:linear-gradient(#eef0ea, #f3efe6); border-bottom:1px solid rgba(150,140,120,.18); }
  .titlebar { display:flex; justify-content:space-between; align-items:baseline; }
  .title { font-weight:700; font-size:15px; color:#54514a; letter-spacing:1px; }
  .tag { font-size:10px; color:#8a857a; border:1px solid #c9c2b3; padding:2px 7px; border-radius:3px; }
  .rn { font-size:13px; color:#9a7b4a; font-family:'Gaegu',cursive; }
  .authbtn { font-size:11px; color:#7d6a52; background:rgba(247,243,234,.7); border:1px solid #c9c2b3;
    border-radius:14px; padding:4px 11px; cursor:pointer; font-family:'Nanum Myeongjo',serif; max-width:130px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:background .15s; }
  .authbtn:active { background:#ece3d0; }
  .authbtn.on { color:#5a7a4a; border-color:#b6c9a8; background:rgba(220,232,200,.4); }
  .stats { display:flex; gap:13px; margin-top:3px; align-items:baseline; }
  .stat b { font-size:18px; font-weight:700; color:#7a6440; }
  .stat span { font-size:10px; color:#8a857a; letter-spacing:.5px; }
  .stat .unit { font-size:11px; color:#9a7b4a; }
  .warm { margin-left:auto; font-size:11px; color:#7d756a; text-align:right; line-height:1.25; }
  .warm b { color:#9a7b4a; }

  /* ---------- 지도 (스크롤 캔버스) ---------- */
  #map { position:absolute; inset:0; z-index:2; overflow:auto; touch-action:none; cursor:grab; }
  #map.grabbing { cursor:grabbing; }
  #map::-webkit-scrollbar { width:0; height:0; }
  #canvas { position:relative; margin:0 auto; }
  #world { position:absolute; top:0; left:0; transform-origin:0 0; }

  /* 줌 컨트롤 */
  .zoomctl { position:absolute; right:14px; bottom:18px; z-index:8; display:flex; flex-direction:column; gap:6px; }
  .zoomctl button { width:38px; height:38px; border:1px solid #c4bca9; border-radius:50%;
    background:rgba(247,243,234,.92); color:#7a6a4a; font-size:20px; font-weight:700;
    font-family:'Nanum Myeongjo',serif; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.12);
    display:flex; align-items:center; justify-content:center; line-height:1; transition:background .15s; }
  .zoomctl button:active { background:#ece3d0; }
  .zoomctl .zlvl { font-size:10px; color:#9a917f; text-align:center; }
  /* 지도 우상단 갈래 필터 (감정 / 몸 — 병렬 보기·집중) */
  .mapfilter { position:absolute; top:12px; right:12px; z-index:8; display:flex; gap:8px; }
  .filtbtn { position:relative; width:46px; height:46px; border-radius:50%; border:1px solid #c4bca9; background:rgba(247,243,234,.82);
    font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:opacity .2s, background .2s, box-shadow .2s, transform .1s; }
  .filtbtn.on { border-color:#9a7b4a; background:#ece3d0; box-shadow:0 2px 9px rgba(120,100,70,.28); }
  .filtbtn:not(.on) { opacity:.38; }
  .filtbtn:active { transform:scale(.93); }
  .filtbtn .cnt { position:absolute; bottom:-3px; right:-3px; font-size:9px; background:#9a7b4a; color:#fff;
    border-radius:8px; padding:1px 4px; line-height:1.2; font-family:'Nanum Myeongjo',serif; }
  .edges { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .edges line { stroke:#bda886; stroke-width:2; stroke-dasharray:5 7; opacity:.5; }
  .edges line.live { stroke:#c98f6a; opacity:.85; stroke-dasharray:none; }
  /* 연관/반대 = 시각 전용 엣지(이동·발견 X) — 감정의 그라데이션·거울쌍 지형 */
  .edges line.assoc { stroke:#9fb0bd; stroke-width:1.4; stroke-dasharray:none; opacity:.4; }
  .edges line.oppo  { stroke:#c6a2ad; stroke-width:1.4; stroke-dasharray:2 6; opacity:.4; }

  .node { position:absolute; transform:translate(-50%,-50%); z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:5px; cursor:default; }
  .node .ring { width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    filter:url(#paint); transition:transform .3s, box-shadow .3s; position:relative; }
  .node .ring .ic { font-size:22px; opacity:.85; }
  .node .label { font-size:12px; color:#6a6358; letter-spacing:.3px; white-space:nowrap; opacity:.9; }
  .node .cost { font-size:11px; color:#9a7b4a; font-family:'Gaegu',cursive; }
  .node .cost.rate { color:#6f9a72; font-weight:700; }

  /* 빈 원 (예고) */
  .node.empty .ring { background:transparent; border:2px dashed #b3a892; opacity:.55; }
  .node.empty .label { color:#9a917f; font-style:italic; }
  /* 발견됨(아직 안 엶) = 희미하게. 열면 .done 으로 뚜렷해짐 */
  .node.reachable { cursor:pointer; }
  .node.reachable .ring { border:2px dashed #bcaa8c; background:rgba(201,143,106,.05);
    animation:faintpulse 2.6s ease-in-out infinite; cursor:pointer; }
  .node.reachable .ring .ic { opacity:.5; }
  .node.reachable .label { color:#9a917f; opacity:.6; font-style:italic; }
  .node.reachable .cost { opacity:.7; }
  @keyframes faintpulse { 0%,100%{opacity:.4} 50%{opacity:.66} }
  /* 완료 */
  .node.done .ring { background:radial-gradient(circle,#fbf6e8,#e7d3b3); border:2px solid #c9a86a; opacity:1; cursor:pointer; }
  .node.done { cursor:pointer; }
  .node.done.person .ring { background:radial-gradient(circle,#fbf6e8,#dcc6e0); }
  /* 대분류(갈래) 허브 노드 — 감정보다 작고 차분하게 */
  .node.category .ring { width:48px; height:48px; }
  .node.category .label { font-weight:700; color:#7a7060; letter-spacing:.6px; }
  .node.done.category .ring { background:radial-gradient(circle,#f4f0e4,#dcd3c2); border:2px solid #b8a87e; }
  .node .lv { position:absolute; bottom:-4px; right:-4px; background:#9a7b4a; color:#fff;
    font-size:9px; font-weight:700; min-width:15px; height:15px; line-height:15px; border-radius:8px; padding:0 3px;
    font-family:'Nanum Myeongjo',serif; }

  /* 로봇 공유 채색 (--p = 마음 온도, #app에서 상속) */
  .bot .shadow{ fill:rgba(80,76,70,.16); }
  .bot .visor{ fill:#33464a; }
  .bot .grille line{ stroke:#4a5b5e; stroke-width:1.3; opacity:.7; }
  .bot .ant{ stroke:#9aa19c; stroke-width:3; stroke-linecap:round; fill:none; }
  .bot .aura{ fill:url(#gAura); opacity:calc(var(--p,0)*.55); transition:opacity 1s; }
  .bot .core{ fill:color-mix(in srgb,#6f9c93 calc((1 - var(--p,0))*100%),#e6a85e); transition:fill 1s; }
  .bot .coreHi{ opacity:calc(.22 + var(--p,0)*.6); }
  .bot .spark{ fill:#fff7e6; opacity:calc(var(--p,0)*.9); }
  .bot .eye{ fill:color-mix(in srgb,#7e9aa6 calc((1 - var(--p,0))*100%),#f0b257); transition:fill 1s; }
  .bot .eyeHi{ fill:#fff; opacity:.9; }
  .bot .tip{ fill:color-mix(in srgb,#b6bcae calc((1 - var(--p,0))*100%),#e89a4e); transition:fill 1s; }
  .bot .tipHalo{ fill:url(#gAura); opacity:calc(var(--p,0)*.5); }

  /* 지도 로봇 토큰 */
  #robot { position:absolute; transform:translate(-50%,-60%); z-index:4; width:92px; pointer-events:none;
    transition:left 1.1s cubic-bezier(.5,.05,.3,1), top 1.1s cubic-bezier(.5,.05,.3,1); }
  #robot svg { width:100%; filter:url(#paintSoft) drop-shadow(0 4px 5px rgba(70,66,60,.22)); animation:bob 3.8s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

  /* 길 페이지 걷기 로봇 (옆모습) — 걸음당 1보(이벤트 구동, 상시 루프 아님) */
  #walkRobot { position:absolute; left:44%; bottom:2%; width:130px; z-index:4; pointer-events:none; transform:translateX(-50%); }
  #walkRobot svg { width:100%; filter:url(#paintSoft) drop-shadow(0 5px 6px rgba(70,66,60,.20)); }
  @keyframes stepbob { 0%{transform:translateY(0)} 38%{transform:translateY(-6px)} 100%{transform:translateY(0)} }
  /* 다리·팔: 한 보마다 전후 스탠스 전환 (걸음이 들어올 때만) */
  #walkRobot .leg, #walkRobot .arm { transform-box:fill-box; transform-origin:top center; transition:transform .15s ease-out; }
  #walkRobot.stepA .legFront{ transform:rotate(20deg) }  #walkRobot.stepA .legBack{ transform:rotate(-20deg) }
  #walkRobot.stepA .armFront{ transform:rotate(-14deg) } #walkRobot.stepA .armBack{ transform:rotate(14deg) }
  #walkRobot.stepB .legFront{ transform:rotate(-20deg) } #walkRobot.stepB .legBack{ transform:rotate(20deg) }
  #walkRobot.stepB .armFront{ transform:rotate(14deg) }  #walkRobot.stepB .armBack{ transform:rotate(-14deg) }
  /* 안테나만 잔잔한 분위기(걷기와 무관) */
  #walkRobot .antG{ transform-box:fill-box; transform-origin:bottom center; animation:antsway 1.8s ease-in-out infinite; }
  @keyframes antsway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(6deg)} }

  /* 떠오르는 입자 */
  .mote { position:absolute; width:16px; height:16px; border-radius:50%; pointer-events:none; z-index:5;
    background:radial-gradient(circle, rgba(255,255,255,.9), rgba(216,168,106,.55) 55%, transparent);
    animation:rise 1.3s ease-out forwards; }
  @keyframes rise { 0%{transform:translate(-50%,-50%) scale(.4); opacity:0}
    25%{opacity:.9} 100%{transform:translate(-50%,-130px) scale(1); opacity:0} }

  /* ---------- 페이지 + 탭바 ---------- */
  .pages { position:relative; z-index:2; flex:1 1 auto; overflow:hidden; }
  .page { position:absolute; inset:0; display:none; }
  .page.active { display:block; }
  .tabbar { position:relative; z-index:7; flex:0 0 auto; display:flex;
    background:linear-gradient(#f3efe6,#eae5d8); border-top:1px solid rgba(150,140,120,.25); }
  .tab { flex:1; padding:12px 0 13px; background:transparent; border:none; cursor:pointer;
    font-family:'Nanum Myeongjo',serif; font-size:14px; color:#9a917f; letter-spacing:1px; }
  .tab .ic { font-size:16px; }
  .tab.active { color:#7a6440; font-weight:700; box-shadow:inset 0 2px 0 #c9a86a; background:rgba(201,168,106,.08); }

  /* ---------- 길 페이지 풍경 (수채, 옆모습) ---------- */
  #pageWalk { overflow:hidden; }
  #pageWalk .sky { position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(120% 60% at 70% 8%, rgba(180,200,210,.45), transparent 60%),
      radial-gradient(90% 50% at 20% 0%, rgba(205,185,180,.35), transparent 55%),
      linear-gradient(#eef0ea 0%, #f3efe6 45%); }
  #pageWalk .scene { position:absolute; left:0; bottom:0; width:100%; height:52%; overflow:hidden; }
  #pageWalk .hill { position:absolute; bottom:8%; border-radius:50% 50% 42% 42%; filter:url(#paint); opacity:.78; }
  /* 먼 언덕은 아주 느린 바람(걷기와 무관한 분위기) */
  #pageWalk .h1 { width:80%; height:42%; left:-12%; background:#aebfa9; animation:drift 70s linear infinite; }
  #pageWalk .h2 { width:78%; height:56%; left:40%;  background:#9fb1c2; opacity:.7;  animation:drift 90s linear infinite; }
  #pageWalk .h3 { width:74%; height:34%; left:80%;  background:#c9b3a6; opacity:.66; animation:drift 60s linear infinite; }
  @keyframes drift { from{transform:translateX(0)} to{transform:translateX(-130%)} }
  #pageWalk .ground { position:absolute; left:0; bottom:0; width:100%; height:18%; background:#cdbfa6; filter:url(#paint); opacity:.85; }
  /* 길 점선: 한 보마다 한 칸 전진 (상시 흐름 아님) */
  #pageWalk .roadline { position:absolute; left:0; bottom:7%; width:100%; height:3px; opacity:.5;
    background:repeating-linear-gradient(90deg,#bda886 0 26px,transparent 26px 54px); transition:background-position .16s ease-out; }
  /* 하늘의 마음 보유 표시 (한 줄 카운트 + 한 줄 칩) */
  #mindsky { position:absolute; top:7px; left:12px; right:12px; z-index:5; display:flex; flex-direction:column; gap:5px; pointer-events:none; }
  .fragline { align-self:flex-start; font-family:'Gaegu',cursive; font-size:14px; color:#7a6a4a; white-space:nowrap;
    background:rgba(247,243,234,.66); border:1px solid rgba(150,140,120,.32); border-radius:12px; padding:2px 11px; }
  .fragline b { color:#9a6a3a; font-size:15px; }
  .fragline .sep { color:#c3b8a2; margin:0 6px; }
  .fragline .goal { color:#9a917f; font-size:11px; margin-left:5px; }
  .fragline .ck { color:#9a7b4a; }
  @keyframes fadein { from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none} }

  /* 새 (하늘) + 꽃·동물 (땅) */
  #birds, #gprops { position:absolute; left:0; right:0; pointer-events:none; }
  #birds { top:0; height:46%; z-index:3; }
  #gprops { bottom:0; height:20%; z-index:3; }
  .bird { position:absolute; animation-name:birdfly; animation-timing-function:linear; animation-fill-mode:forwards; }
  @keyframes birdfly { from{ left:106%; } to{ left:-16%; } }
  .bird svg { display:block; animation:flap .5s ease-in-out infinite; }
  @keyframes flap { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(.6)} }
  .gprop { position:absolute; bottom:8%; left:0; filter:url(#paint); transition:transform .16s ease-out; will-change:transform; }

  .walkhint { position:absolute; left:0; right:0; bottom:4%; text-align:center; z-index:4;
    font-family:'Nanum Pen Script',cursive; font-size:18px; color:#8a8071; animation:breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{opacity:.55} 50%{opacity:1} }
  /* 걷는 동안 로봇의 상태 로그 — 감정을 '오류/고장'으로 읽는 순진한 독백이 흐른다 */
  #syslog { position:absolute; left:14px; right:14px; top:50px; bottom:auto; z-index:4; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; }
  .syslog-line { font-family:'Gaegu',cursive; font-size:14px; line-height:1.4; color:#7c7468; max-width:300px;
    opacity:0; transform:translateY(8px); transition:opacity .8s ease, transform .8s ease;
    text-shadow:0 1px 0 rgba(247,243,234,.7); }
  .syslog-line.in  { opacity:.92; transform:none; }
  .syslog-line.out { opacity:0; transform:translateY(-6px); }
  .syslog-line .pre  { color:#9a9384; letter-spacing:.3px; }   /* 차가운 기계 말투 */
  .syslog-line .warm { color:#9a6a3a; }                        /* 감정이 새어나온 부분 */
  /* 회차 후 '기억 재해석' — 옛 차가운 로그에 줄을 긋고 손글씨로 다시 읽는다 */
  .syslog-line.reinterp { max-width:330px; }
  .syslog-line .struck  { display:block; font-family:'Courier New',monospace; font-size:12px; color:#a7a08f;
    text-decoration:line-through; text-decoration-color:#c7bda6; opacity:.85; }
  .syslog-line .rewrite { display:block; font-family:'Gaegu',cursive; font-size:17px; color:#9a6a3a; margin-top:3px; }
  .syslog-line .rewrite .pen { color:#bfa06a; margin-right:3px; }
  .tapfx { position:fixed; pointer-events:none; z-index:30; font-family:'Nanum Pen Script',cursive;
    color:#9a7b4a; font-size:16px; animation:tapup .7s ease-out forwards; }
  @keyframes tapup { from{opacity:.9; transform:translate(-50%,0)} to{opacity:0; transform:translate(-50%,-34px)} }

  /* ---------- 온보딩(튜토리얼 + 이름짓기) ---------- */
  .intro { position:absolute; inset:0; z-index:40; display:none; flex-direction:column; align-items:center; justify-content:center;
    padding:30px; background:linear-gradient(160deg,#eef0ea,#e6e1d4); }
  .intro.show { display:flex; animation:fade .6s ease; }
  .introcard { width:100%; max-width:320px; text-align:center; }
  .introbadge { font-size:12px; color:#9a8a6a; letter-spacing:3px; margin-bottom:24px; }
  .introtext { font-family:'Gaegu',cursive; font-size:24px; line-height:1.7; color:#4d443a; white-space:pre-line;
    min-height:170px; display:flex; align-items:center; justify-content:center; transition:color .4s, font-family .1s; }
  .introtext.cold { font-family:'Courier New',monospace; font-size:16px; letter-spacing:1px; color:#6f7d72; }  /* 차가운 기계 비트 */
  .introname { display:flex; gap:8px; justify-content:center; align-items:center; margin:4px 0; }
  .introname input { font-family:'Gaegu',cursive; font-size:23px; text-align:center; width:165px; padding:7px 10px;
    border:none; border-bottom:2px solid #c9a86a; background:transparent; color:#6f5d3c; outline:none; }
  .introname button { font-size:19px; background:rgba(247,243,234,.7); border:1px solid #c9c2b3; border-radius:50%;
    width:42px; height:42px; cursor:pointer; }
  .intro #introBtn { margin-top:26px; width:100%; max-width:280px; padding:13px; border:1px solid #b9a98c; background:#ece3d0;
    font-family:'Nanum Myeongjo',serif; font-weight:700; font-size:15px; color:#6f5d3c; letter-spacing:2px; cursor:pointer; border-radius:2px; }
  .intro #introBtn:active { background:#e0d4ba; }
  .introskip { margin-top:15px; font-size:12px; color:#a59b8a; cursor:pointer; }

  /* ---------- 회차 정산 (프레스티지) ---------- */
  .prestige { position:absolute; inset:0; z-index:42; display:none; flex-direction:column; align-items:center; justify-content:center;
    padding:30px; background:linear-gradient(160deg,#eaf0ee,#dfe6e2); }
  .prestige.show { display:flex; animation:fade .7s ease; }
  .prestige .pcard { width:100%; max-width:330px; text-align:center; }
  .prestige .pbadge { font-size:12px; color:#7a9088; letter-spacing:3px; margin-bottom:18px; }
  .prestige .pgain { font-family:'Gaegu',cursive; font-size:30px; color:#3f6b62; line-height:1.35; }
  .prestige .pgain b { color:#2f8f7d; }
  .prestige .pcycle { font-size:12px; color:#869a92; margin:6px 0 22px; }
  .prestige .lookbox { border:1px solid #cdd8d2; background:rgba(247,250,248,.6); border-radius:4px; padding:15px 14px 16px; text-align:left; }
  .prestige .lookttl { font-family:'Nanum Myeongjo',serif; font-weight:700; font-size:14px; color:#3f6b62; letter-spacing:1px; }
  .prestige .lookdesc { font-size:12px; color:#7a857e; line-height:1.6; margin:6px 0 12px; word-break:keep-all; }
  .prestige .lookprev { font-family:'Gaegu',cursive; font-size:16px; color:#9a6a3a; min-height:26px; margin-bottom:10px;
    border-left:2px solid #cdb89a; padding-left:10px; }
  .prestige .lookprev .s { display:block; font-family:'Courier New',monospace; font-size:11px; color:#a7a08f; text-decoration:line-through; }
  .prestige .lookrow { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .prestige .lookcnt { font-size:12px; color:#5f7a72; }
  .prestige .lookcnt b { color:#2f8f7d; font-size:15px; }

<script>
/* ===================== 데이터 (3막 깊은 그래프) =====================
   중심 실: 고철 로봇이 자길 만들고 떠난 '그 사람'의 흐릿한 얼굴을 안고 걷는다.
   감정을 배울수록(person 노드) 그 얼굴이 또렷해지고(mem), 길 끝에서 재회 → 사람이 된다.
   person = 만남이자 업그레이드 생성기. lines[0]=첫 만남, 이후=재회 심화. mem=그 사람 기억 한 조각. */
const PEOPLE = {
  // ── 인간 감정 27가지 (Cowen & Keltner, 2017) — 로봇의 순진한 직설 일기 ──
  // ▸ 애정·아름다움
  adore: { name:"애틋함", color:"#f0c0b0",
    situ:"엄마가 <b>자는 아이를 한참 바라본다.</b>",
    lines:[
      "엄마가 아이를\n오래 바라봤다.\n눈빛이 말랑했다.\n이게 애틋함이다.",
      "보고 또 봐도\n안 질리는 거였다.",
      "나도 누굴\n그렇게 보고 싶다." ],
    mem:"그 사람도 나를\n그렇게 봤을까." },
  beauty: { name:"아름다움", color:"#cdd8e0",
    situ:"<b>노을이 하늘을 붉게 물들인다.</b>",

// 프랙탈 트리 배치: 각 가지가 '자손 잎 수'에 비례한 부채꼴(sector)을 받아 바깥으로 뻗는다.
// 가지마다 자기 부채꼴 안에서만 다시 갈라지므로(자기유사) 서로 절대 안 겹치고 나무처럼 펼쳐진다.
// 가지 길이는 깊어질수록 일정 비율로 짧아져(DECAY) 프랙탈 특유의 결이 난다.
function computeRadialLayout(){
  const kids={}; NODES.forEach(n=>kids[n.id]=[]);
  NODES.forEach(n=>{ if(n.parent) kids[n.parent].push(n.id); });
  const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
  const hash=s=>{ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return ((h>>>0)%100000)/100000; }; // [0,1)
  // 각 노드의 '자손 잎(leaf) 수' = 그 가지가 차지할 각도 폭의 가중치
  const leaf={};
  (function w(id){ const ch=kids[id]; if(!ch.length) return leaf[id]=1; let s=0; ch.forEach(c=>s+=w(c)); return leaf[id]=s; })("start");

  const SEG0=0.20, DECAY=0.72;                  // 가지 길이: 깊어질수록 0.72배(자기유사) → 프랙탈 결
  const seg = depth => SEG0*Math.pow(DECAY, depth);

  // assign: 노드를 (반지름, 방향)에 놓고, 자기 부채꼴 [lo,hi]를 자식들에게 잎 수 비례로 분배
  (function assign(id, dir, radius, lo, hi, depth){
    const n=byId[id];
    n.x=0.5 + radius*Math.cos(dir); n.y=0.5 + radius*Math.sin(dir);
    if(id==="becoming") return;                 // 샘의 자식(human)은 정규화 뒤 따로 배치
    const ch=kids[id]; if(!ch.length) return;
    const span=hi-lo, totW=ch.reduce((s,c)=>s+leaf[c],0);
    let acc=lo;
    ch.forEach(c=>{
      const frac=leaf[c]/totW, clo=acc, chi=acc+span*frac; acc=chi;
      const jit=(hash(c)-0.5)*span*frac*0.22;   // 부채꼴 안에서만 살짝 흔들어 유기적으로
      assign(c, (clo+chi)/2 + jit, radius+seg(depth), clo, chi, depth+1);
    });
  })("start", -Math.PI/2, 0, -Math.PI, Math.PI, 0);   // root: 자식들이 360° 전체로 펼쳐짐

  // 잎이 같은 반지름에 몰려 닿을 때만 살짝 떼는 가벼운 보정(부채꼴 구조·교차는 유지)
  const MIND=0.085, sim=NODES.filter(n=>n.id!=="human"&&n.id!=="start");
  for(let it=0; it<70; it++){
    for(let i=0;i<sim.length;i++) for(let j=i+1;j<sim.length;j++){
      const a=sim[i], b2=sim[j]; let dx=b2.x-a.x, dy=b2.y-a.y, d=Math.hypot(dx,dy);
      if(d<1e-6){ dx=(hash(a.id)-0.5)*0.02; dy=(hash(b2.id+"y")-0.5)*0.02; d=Math.hypot(dx,dy)||1e-6; }
      if(d>=MIND) continue;
      const ux=dx/d, uy=dy/d, g=(MIND-d)/2;
      a.x-=ux*g; a.y-=uy*g; b2.x+=ux*g; b2.y+=uy*g;
    }
  }
  // 중심 기준으로 전체를 캔버스에 꽉 차게 정규화(프랙탈 모양은 보존, 크기만 맞춤)
  let maxR=0; NODES.forEach(n=>{ if(n.id!=="human") maxR=Math.max(maxR, Math.hypot(n.x-0.5, n.y-0.5)); });
  const sc = maxR>0 ? 0.45/maxR : 1;
  NODES.forEach(n=>{ if(n.id!=="human"){ n.x=0.5+(n.x-0.5)*sc; n.y=0.5+(n.y-0.5)*sc; } });
  // 사람(human)은 샘(becoming) 바깥으로 살짝 떨어뜨려 배치(정규화 뒤).
  const b=byId["becoming"], hu=byId["human"];
  if(hu&&b){ const dx=b.x-0.5, dy=b.y-0.5, len=Math.hypot(dx,dy)||1; hu.x=b.x+(dx/len)*0.1; hu.y=b.y+(dy/len)*0.1; }
  NODES.forEach(n=>{ n.x=Math.max(0.03,Math.min(0.97,n.x)); n.y=Math.max(0.03,Math.min(0.97,n.y)); }); // 캔버스 안으로
}
computeRadialLayout();

let zoom = 0.85;
const ZMIN=0.4, ZMAX=2.2;
const baseSize = () => Math.max(map.clientWidth, map.clientHeight) * 2.9;  // 정사각 월드(방사형) — 넓게 펼쳐 노드 간격 확보
const px = n => ({ x: n.x*baseSize(), y: n.y*baseSize() });                 // 미스케일 월드 좌표
function sizeCanvas(){
  const s=baseSize();
  world.style.width=s+"px"; world.style.height=s+"px"; world.style.transform="scale("+zoom+")";
  canvas.style.width=(s*zoom)+"px"; canvas.style.height=(s*zoom)+"px";
}
function centerOn(id, smooth){
  const n=NODES.find(x=>x.id===id); if(!n) return; const p=px(n);
  map.scrollTo({ left:p.x*zoom-map.clientWidth/2, top:p.y*zoom-map.clientHeight/2, behavior:smooth?"smooth":"auto" });
}
function setZoom(z){
  zoom = Math.max(ZMIN, Math.min(ZMAX, z));
  sizeCanvas(); centerOn(S.current);
  const zl=document.getElementById('zlvl'); if(zl) zl.textContent = zoom.toFixed(1)+"×";
}

function fmt(n){ return n>=1000 ? (n/1000).toFixed(2)+"k" : Math.floor(n); }

/* ---------- 도달 가능 판정 ---------- */
function neighbors(id){
  const out=[];
  EDGES.forEach(([a,b,c])=>{ if(a===id) out.push([b,c]); if(b===id) out.push([a,c]); });
  return out;
}
function reachCost(id){ // 완료 노드와 잇는 간선 중 최소 비용(=열 수 있는 비용)
  let c=Infinity;
  neighbors(id).forEach(([nb,cost])=>{ if(S.levels[nb]>0) c=Math.min(c,cost); });
  return c;
}
// 노드는 '걸음을 그 비용만큼 모은' 순간 처음 희미하게 발견된다(이후 계속 보임).
function gateOk(n){                                 // 챕터 게이트
  if(n.type==="ending") return learnedCount()>=FRAG_TOTAL && bodyCount()>=BODY_TOTAL; // 샘 재회 = 마음27 + 몸11 둘 다
  if(n.type==="human")  return S.levels["becoming"]>0;                                // 샘을 만난 뒤에 사람
  return true;   // person·body 는 평소 발견 규칙(부모 완료 + 걸음)으로 '병렬' 성장
}
function updateDiscovered(){
  let changed=false;
  NODES.forEach(n=>{
    if(n.id==="start" || S.levels[n.id]>0 || S.discovered[n.id]) return;
    const c=reachCost(n.id);                       // 부모가 완료돼야 비용이 유한
    if(c!==Infinity && S.walks>=c && gateOk(n)){ S.discovered[n.id]=true; changed=true; }
  });
  return changed;
}
function isRevealed(id){ return S.levels[id]>0 || !!S.discovered[id]; }

function renderEdges(){
  edgesSvg.innerHTML="";
  const W=canvas.clientWidth;
  EDGES.forEach(([a,b])=>{
    const na=NODES.find(n=>n.id===a), nb=NODES.find(n=>n.id===b);
    const pa=px(na), pb=px(nb);
    if(!(isRevealed(a)&&isRevealed(b))) return;
    if(!(inMapFilter(na)&&inMapFilter(nb))) return;     // 갈래 필터(감정/몸)
    const live = S.levels[a]>0 && S.levels[b]>0;
    const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
    ln.setAttribute("x1",pa.x);ln.setAttribute("y1",pa.y);
    ln.setAttribute("x2",pb.x);ln.setAttribute("y2",pb.y);
    if(live) ln.classList.add("live");
    edgesSvg.appendChild(ln);
  });
  // 연관/반대(시각 전용): 양 끝이 모두 드러났고 같은 갈래 필터일 때만 — 이동/발견엔 영향 없음
  REL_EDGES.forEach(([a,b,t])=>{
    const na=NODES.find(n=>n.id===a), nb=NODES.find(n=>n.id===b);
    if(!na||!nb) return;
    if(!(isRevealed(a)&&isRevealed(b))) return;
    if(!(inMapFilter(na)&&inMapFilter(nb))) return;
    const pa=px(na), pb=px(nb);
    const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
    ln.setAttribute("x1",pa.x);ln.setAttribute("y1",pa.y);
    ln.setAttribute("x2",pb.x);ln.setAttribute("y2",pb.y);
    ln.classList.add("rel", t);
    edgesSvg.appendChild(ln);
  });
}

             : n.type==="body"?BODY[n.key].name
             : n.type==="category"?n.name
             : (n.type==="start"?"시작" : n.type==="ending"?"샘알트머스크" : n.type==="human"?"사람" : "…");
    const reach = !done && n.type!=="teaser";
    const cost = reach ? reachCost(n.id) : null;
    el.innerHTML =
      `<div class="ring"><span class="ic">${n.type==="teaser"?"?":n.icon}</span>${done&&n.gen?`<span class="lv">Lv${lv}</span>`:""}</div>`+
      `<div class="label">${n.type==="teaser"?"안갯속 무언가":name}</div>`+
      (reach?`<div class="cost">${cost} 걸음</div>`:
        (done&&n.gen?`<div class="cost rate">+${(n.gen*lv).toFixed(1)}/초</div>`:""));
    if(reach) el.onclick = ()=>tryUnlock(n);
    else if(done && n.gen) el.onclick = ()=>openNode(n,false);
    world.appendChild(el);
  });
}
function placeRobot(animate){
  const n=NODES.find(x=>x.id===S.current), p=px(n);
  robot.style.left=p.x+"px"; robot.style.top=p.y+"px";
}
function refreshHUD(){
  elWalks.textContent=fmt(S.walks);
  elRate.textContent=S.rate.toFixed(1);
  const rn=document.getElementById('robotName');
  if(rn) rn.textContent = (S.robotName?("· "+S.robotName):"") + (S.cycle>0?` · ${S.cycle}회차`:"");
  const ds=document.getElementById('depthStat');
  if(ds){ if(S.depth>0 || S.cycle>0){ ds.style.display=""; document.getElementById('mdepth').textContent=S.depth; } else ds.style.display="none"; }
  const persons = NODES.filter(n=>n.type==="person");
  const learned = persons.filter(n=>S.levels[n.id]>0).length;   // 마음 온도 = 배운 감정 종류 / 전체
  const p = persons.length ? learned/persons.length : 0;
  elWarm.textContent=Math.round(p*100);
  app.style.setProperty("--p",p);   // 두 로봇 공유(상속)
  renderMind();
}
// 하늘엔 진행도(감정/몸 조각 수)만 — 감정 이름 나열은 하지 않는다(하늘은 로그용 비움)
function renderMind(){
  const emo=learnedCount(), bodyN=bodyCount();
  const emoDone=emo>=FRAG_TOTAL, bodyDone=bodyN>=BODY_TOTAL, both=emoDone&&bodyDone;
  mindsky.innerHTML=`<div class="fragline">🧩 <b>${emo}</b>/27${emoDone?' <span class="ck">✓</span>':''}`
         + `<span class="sep">·</span>🫀 <b>${bodyN}</b>/11${bodyDone?' <span class="ck">✓</span>':''}</div>`;
}
function renderAll(){ sizeCanvas(); renderEdges(); renderNodes(); placeRobot(); refreshHUD(); updateFilterBtns(); }

/* ---------- 지도 갈래 보기: 감정 ↔ 몸 (배타 선택 — 한 번에 한 갈래만) ---------- */
let mapView = "emo";                                 // "emo" = 감정 지도 / "body" = 몸 지도
function inMapFilter(n){
  if(!n) return true;
  if(n.type==="person"||n.type==="category") return mapView==="emo";  // 감정·대분류는 감정 보기에서만
  if(n.type==="body")   return mapView==="body";      // 몸 노드는 몸 보기에서만
  return true;                                        // start·ending(샘)·human·teaser 는 항상 표시
}
function updateFilterBtns(){
  const e=document.getElementById('fEmo'), b=document.getElementById('fBody');
  if(e) e.classList.toggle('on', mapView==="emo");
  if(b) b.classList.toggle('on', mapView==="body");
  const ce=document.getElementById('cntEmo'), cb=document.getElementById('cntBody');
  if(ce) ce.textContent = `${learnedCount()}/${FRAG_TOTAL}`;
  if(cb) cb.textContent = `${bodyCount()}/${BODY_TOTAL}`;
}
function selectMapView(v){
  mapView = v;
  updateFilterBtns(); renderEdges(); renderNodes(); placeRobot();
  const cur=NODES.find(n=>n.id===S.current);
  centerOn(inMapFilter(cur) ? S.current : "start");   // 현재 노드가 안 보이는 갈래면 start로
}
document.getElementById('fEmo')?.addEventListener('click', ()=>selectMapView('emo'));
document.getElementById('fBody')?.addEventListener('click', ()=>selectMapView('body'));

/* ---------- 이동 + 만남 ---------- */
function travelTo(n, cb){
  S.current=n.id; placeRobot(true);
  centerOn(n.id, true);
  setTimeout(cb, 1100);
}
function tryUnlock(n){
  const cost=reachCost(n.id);
  if(S.walks < cost){ nudge(`걸음이 ${cost-Math.floor(S.walks)|0} 더 필요해`); return; }
  S.walks -= cost; syncSteps();
  travelTo(n, ()=>{
    S.levels[n.id]=1; S.rate+=n.gen; spark();
    openNode(n,true);
    renderAll();
  });
}
function learnedCount(){ return NODES.filter(n=>n.type==="person" && S.levels[n.id]>0).length; }
function bodyCount(){ return NODES.filter(n=>n.type==="body" && S.levels[n.id]>0).length; }
const FRAG_TOTAL = 27;   // 인간 감정 27가지 (Cowen & Keltner, 2017)
const BODY_TOTAL = 11;   // 인체 11 기관계

function openNode(n, firstMeet){
  const lv=S.levels[n.id];
  if(n.type==="ending"){           // 샘 재회 — 마음27 + 몸11 둘 다 모은 뒤에만 도달(gateOk)
    fillModal({ badge:"길 끝, 다시 만난 샘", emo:"샘 알트머스크", lv:"나를 만든 사람", situ:"",
      log: SAM_TWIST,
      reward:["🧩 감정 27 · 🫀 몸 11 — 다 모았다","💗 …근데 샘이 이상한 말을 한다"], closeText:"사람이… 되는 걸까" });
    return;
  }
  if(n.type==="human"){            // 반전 — 알고 보니 처음부터 사람이었다
    afterClose = openPrestige;     // 이 모달을 닫으면 → 회차 정산(프레스티지)으로
    fillModal({ badge:"반전", emo:"🕊 사람이 되다", lv:"", situ:"", log: HUMAN_TEXT,
      reward:["✨ 알고 보니, 처음부터","💗 너는 이미 사람이었어"], closeText:"…그리고, 다시 길 위에" });
    return;
  }
  if(n.type==="category"){          // 대분류 허브 — 이야기 없이, 갈래가 펼쳐졌다는 신호만
    fillModal({ badge:"마음의 갈래에 닿다", emo:`〈 ${n.name} 〉`, lv:"", situ:"",
      log: n.intro || "여기서 마음의 갈래가 펼쳐진다.",
      reward:["🌿 새 갈래가 열렸다", `🌫️ ${n.name}의 감정들이 안갯속에서 드러난다`], closeText:"감정을 만나러" });
    return;
  }
  const cur=(n.gen*lv), nxt=(n.gen*(lv+1));   // 이 노드의 걸음/초 기여(강할수록 큼)
  const maxed = !firstMeet && lv>=MAX_LV;        // 재회 상한 도달
  if(n.type==="body"){
    const bd=BODY[n.key]; const lineIdx=Math.min(lv-1, bd.lines.length-1);
    fillModal({ badge:firstMeet?"몸의 한 부분을 얻다":(maxed?"가장 단단해졌다":"몸이 더 단단해진다"),
      emo:`〔 ${bd.name} 〕`, lv:firstMeet?`걸음/초 +${n.gen.toFixed(2)}`:(maxed?`Lv${lv} · 더없이 단단하다 (최대)`:`Lv${lv} · 걸음/초 +${cur.toFixed(1)}`),
      situ: firstMeet?bd.situ:"", log: firstMeet?bd.lines[0]:bd.lines[lineIdx],
      reward: firstMeet?[`🫀 몸조각 +1 (${bodyCount()}/${BODY_TOTAL})`,`📈 걸음/초 +${n.gen.toFixed(2)}`,`사람에 한 걸음 더`]
             :(maxed?[`📖 ${bd.name} — 더없이 단단해졌다`,`📈 걸음/초 +${cur.toFixed(1)} · 최대 Lv${MAX_LV}`]
                    :[`📖 ${bd.name}이(가) 더 깊어진다`,`📈 걸음/초 +${cur.toFixed(1)} → +${nxt.toFixed(1)}`]),
      closeText:"다음 길로",
      upText: (firstMeet||maxed)?null:`더 단단히 — ${upCost(n,lv+1)} 걸음`, onUp:()=>upgrade(n) });
    return;
  }
  {
    const pp=PEOPLE[n.key];
    const lineIdx=Math.min(lv-1, pp.lines.length-1);
    const log = firstMeet ? (pp.lines[0] + "\n\n·   ·   ·\n\n" + pp.mem) : pp.lines[lineIdx];
    fillModal({ badge:firstMeet?"하나의 감정을 알게 되다":(maxed?"마음 끝까지 닿았다":"다시 만나, 더 깊이"),
      emo:`『 ${pp.name} 』`, lv:firstMeet?`걸음/초 +${n.gen.toFixed(2)}`:(maxed?`재회 ${lv-1}회 · 마음 끝까지 (최대)`:`재회 ${lv-1}회 · 걸음/초 +${cur.toFixed(1)}`),
      situ: firstMeet?pp.situ:"", log,
      reward: firstMeet?[`🧩 감정조각 +1 (${learnedCount()}/${FRAG_TOTAL})`,`🎨 회색 세계에 ${pp.name}의 색이 번진다`,`🧩 그 사람의 얼굴이 조금 또렷해진다`]
             :(maxed?[`📖 ${pp.name} — 마음 끝까지 닿았다`,`📈 걸음/초 +${cur.toFixed(1)} · 최대 Lv${MAX_LV}`,`(이 인연은 더없이 깊어졌다)`]
                    :[`📖 ${pp.name}의 더 깊은 이야기`,`📈 더 깊이 이해하면 걸음/초 +${cur.toFixed(1)} → +${nxt.toFixed(1)}`,`(깊은 마음일수록 걸음이 더 빨라진다)`]),
      closeText:"다음 길로",
      upText: (firstMeet||maxed)?null:`다시 만나 더 깊이 — ${upCost(n,lv+1)} 걸음`, onUp:()=>upgrade(n) });
  }
}
function nextUpLabel(n){
  const cost=upCost(n,S.levels[n.id]+1);
  return `재회해 더 깊이 — ${cost} 걸음`;
}
function upgrade(n){
  if(S.levels[n.id]>=MAX_LV){ nudge(`이미 끝까지 깊어졌다 (최대 Lv${MAX_LV})`); return false; }
  const cost=upCost(n, S.levels[n.id]+1);
  if(S.walks<cost){ nudge(`${cost-Math.floor(S.walks)|0} 걸음 더`); return false; }
  S.walks-=cost; syncSteps(); S.levels[n.id]++; S.rate+=n.gen;
  spark(); travelTo(n, ()=>openNode(n,false));
  renderAll();
  return true;
}

/* ---------- 모달 ---------- */
let modalUp=null;   // 보조(재회) 액션
function fillModal(o){
  $("#mBadge").textContent=o.badge; $("#mEmo").textContent=o.emo;
  $("#mLv").textContent=o.lv||""; $("#mSitu").innerHTML=o.situ||""; $("#mSitu").style.display=o.situ?"block":"none";
  $("#mLog").textContent=o.log;
  $("#mReward").innerHTML=(o.reward||[]).map(r=>`<span class="r">${r}</span>`).join("");
  $("#mBtn").textContent=o.closeText||"다음 길로";
  const b2=$("#mBtn2");
  if(o.upText){ b2.style.display="block"; b2.textContent=o.upText; modalUp=o.onUp; }
  else { b2.style.display="none"; modalUp=null; }
  modal.classList.add("show");
}
let afterClose=null;                               // 모달 닫은 뒤 이어질 흐름(엔딩→프레스티지)
$("#mBtn").onclick=closeModal;                     // 주 버튼 = 다음 길로(닫기)
$("#mBtn2").onclick=()=>{ if(modalUp) modalUp(); }; // 보조 = 재회(있을 때만)
modal.addEventListener("click", e=>{ if(e.target===modal) closeModal(); });  // 카드 바깥(배경) 클릭 = 닫기
function closeModal(){ modal.classList.remove("show"); renderAll();
  const a=afterClose; afterClose=null; if(a) setTimeout(a, 280); }

/* ---------- 회차 정산 (프레스티지) — 한 생을 마치고 마음의 깊이를 얻어 다시 걷는다 ---------- */
const LOOKBACK_COST = 2;                            // 기억 한 조각 재해석 비용(마음의 깊이)
function prestigeGain(){                             // 이번 생에 모은 것 = 마음의 깊이
  const emo=learnedCount(), body=bodyCount();
  let extra=0; NODES.forEach(n=>{ if((n.type==="person"||n.type==="body") && S.levels[n.id]>1) extra+=S.levels[n.id]-1; });
  return emo + body + Math.floor(extra/4);          // 첫 생 = 27+11 = 38, 재회 깊이는 보너스
}
let pendingGain=0;
function openPrestige(){
  pendingGain = prestigeGain();
  S.depth += pendingGain; S.cycle++;                // 정산은 진입 즉시(되돌아보기에 바로 쓰도록)
  $("#prestigeGain").innerHTML = `🌊 마음의 깊이 <b>+${pendingGain}</b>`;
  $("#prestigeCycle").textContent = `${S.cycle}번째 여행을 마쳤다 · 가진 마음의 깊이 ${S.depth}`;
  renderLookback();
  document.getElementById('prestige').classList.add('show');
  refreshHUD(); saveState();
}
function renderLookback(){
  const max=SYS_REINTERP.length;
  $("#lookCnt").textContent = S.lookback;
  $("#lookMax").textContent = `/ ${max}`;
  const prev=$("#lookPrev");
  if(S.lookback>0){ const r=SYS_REINTERP[S.lookback-1];
    prev.innerHTML = `<span class="s">${r.old}</span>✎ ${r.fix}`; }
  else prev.innerHTML = `<span style="color:#a8b0aa">아직 되돌아본 기억이 없다…</span>`;
  const btn=$("#lookBuy");
  if(S.lookback>=max){ btn.disabled=true; btn.textContent="모두 되돌아봤다"; }
  else { btn.disabled = S.depth < LOOKBACK_COST;
    btn.textContent = `깊이 ${LOOKBACK_COST} 써서 되돌아보기`; }
}
$("#lookBuy").onclick=()=>{
  if(S.lookback>=SYS_REINTERP.length || S.depth<LOOKBACK_COST) return;
  S.depth-=LOOKBACK_COST; S.lookback++; renderLookback(); refreshHUD(); saveState();
};
$("#prestigeGo").onclick=()=>{ doPrestige(); };
function doPrestige(){                               // 리셋: 걸음·rate·진행 초기화 / depth·cycle·lookback·이름 보존
  document.getElementById('prestige').classList.remove('show');
  S.walks=0; S.rate=1.0; S.current="start"; S.discovered={};
  NODES.forEach(n=>S.levels[n.id]= n.completed?1:0);
  wholeWalks=0; worldX=0;
  showPage("walk"); refreshHUD(); renderAll(); saveState();
  const h=$("#hint");
  if(h){ h.textContent = `다시, 처음부터. 이번엔 ${S.robotName}가 무엇을 다시 보게 될까`;
    setTimeout(()=>{ h.textContent="이 길을 두드릴수록 로봇이 더 빨리 걷는다"; }, 5200); }
}

/* ---------- 걸음당 1보(步) : 걸음이 들어올 때만 한 발 ---------- */
let stepPhase=false, wholeWalks=0, worldX=0;
function stepOnce(){
  stepPhase=!stepPhase;
  walkRobot.classList.remove("stepA","stepB");
  walkRobot.classList.add(stepPhase?"stepA":"stepB");
  const svg=walkRobot.querySelector("svg");           // 한 보 bob (재시작)
  svg.style.animation="none"; void svg.offsetWidth; svg.style.animation="stepbob .26s ease-out";
  worldX += 27;                                        // 길 한 칸 전진(점선 주기 54 → 반칸씩 교차)
  roadEl.style.backgroundPosition = (-(worldX%54))+"px 0";
  advanceGProps(27);                                   // 꽃·동물도 한 칸 흐른다
  if(Math.random()<0.085) spawnGProp();                // 가끔 새 오브젝트 등장
}
// S.walks의 정수 자리가 늘 때마다 그만큼 보(步). 줄어들면(소비) 보 없이 동기화만.
function syncSteps(){ const w=Math.floor(S.walks); if(w>wholeWalks) stepOnce(); wholeWalks=w; }

/* ---------- 탭 = 걸음 ---------- */
function addWalk(x,y){
  S.walks+=TAP_GAIN;
  if(x!=null){ const m=document.createElement("div"); m.className="mote";
    m.style.left=x+"px"; m.style.top=y+"px"; document.body.appendChild(m);
    setTimeout(()=>m.remove(),1300);
    const t=document.createElement("div"); t.className="tapfx"; t.textContent="+"+TAP_GAIN;
    t.style.left=x+"px"; t.style.top=(y-8)+"px"; document.body.appendChild(t); setTimeout(()=>t.remove(),700);
  }
  elWalks.textContent=fmt(S.walks);
  syncSteps();                                         // 탭 1회 = 1걸음 = 1보 (연달아 3탭 → 3보)
}
// 길 페이지 = 핵심 손맛: 두드리면 걷는다
$("#pageWalk").addEventListener("pointerdown", e=>addWalk(e.clientX, e.clientY));
// 지도: 끌면 팬(이동), 짧게 누르면 걷기. 노드는 클릭(별도).
let dragOn=false, dragMoved=false, dsx=0, dsy=0, dscL=0, dscT=0;
map.addEventListener("pointerdown",e=>{
  if(e.target.closest(".node")) return;
  if(window.__pinch) return;
  dragOn=true; dragMoved=false; dsx=e.clientX; dsy=e.clientY; dscL=map.scrollLeft; dscT=map.scrollTop;
});
map.addEventListener("pointermove",e=>{
  if(!dragOn || window.__pinch) return;
  const dx=e.clientX-dsx, dy=e.clientY-dsy;
  if(!dragMoved && Math.abs(dx)+Math.abs(dy)>6) { dragMoved=true; map.classList.add("grabbing"); }
  if(dragMoved){ map.scrollLeft=dscL-dx; map.scrollTop=dscT-dy; }
});
window.addEventListener("pointerup",e=>{
  if(dragOn && !dragMoved) addWalk(e.clientX, e.clientY);   // 안 끌었으면 = 탭 = 걷기
  dragOn=false; map.classList.remove("grabbing");
});

function nudge(msg){ const h=$("#hint"); const old=h.textContent; h.textContent=msg;
  h.style.color="#c0794a"; setTimeout(()=>{h.textContent=old;h.style.color="";},1100); }
function spark(){ const rb=robot.getBoundingClientRect();
  const cx=rb.left+rb.width/2, cy=rb.top+rb.height*0.42;
  for(let i=0;i<6;i++){ const m=document.createElement("div"); m.className="mote";
    m.style.left=(cx+(Math.random()*40-20))+"px"; m.style.top=cy+"px";
    document.body.appendChild(m); setTimeout(()=>m.remove(),1300); } }

/* ---------- 풍경 생물: 새(하늘) · 꽃/동물(땅) ---------- */
function BIRD_SVG(){ return `<svg width="26" height="14" viewBox="0 0 26 14"><path d="M1 9 Q6 2 13 8 Q20 2 25 9" fill="none" stroke="#8a8f96" stroke-width="2" stroke-linecap="round" opacity=".55"/></svg>`; }
function FLOWER_SVG(){ const pal=[["#f0c0c8","#e7aeb8"],["#cdbfe2","#bcabd6"],["#bcd0e6","#a9c2dd"],["#efd6ac","#e6c48c"]];
  const c=pal[Math.floor(Math.random()*pal.length)];
  return `<svg width="22" height="32" viewBox="0 0 22 32"><line x1="11" y1="32" x2="11" y2="15" stroke="#7d9b6e" stroke-width="2"/><circle cx="6" cy="11" r="3.6" fill="${c[1]}"/><circle cx="16" cy="11" r="3.6" fill="${c[1]}"/><circle cx="11" cy="7" r="3.6" fill="${c[1]}"/><circle cx="11" cy="11" r="4.4" fill="${c[0]}"/><circle cx="11" cy="11" r="2" fill="#f6e6c0"/></svg>`; }
function ANIMAL_SVG(){ const t="#b0a896"; return `<svg width="34" height="26" viewBox="0 0 34 26"><ellipse cx="19" cy="18" rx="12" ry="7" fill="${t}"/><circle cx="8" cy="13" r="5.2" fill="${t}"/><path d="M5 9 q-1 -8 2.5 -8 q1.2 4 -.2 8z" fill="${t}"/><ellipse cx="30" cy="22" rx="3.2" ry="2.4" fill="#9a9384"/><circle cx="6" cy="13" r="1" fill="#5a554c"/></svg>`; }

const gprops=[];
function spawnGProp(){
  const W = gpropsEl.clientWidth || 380;
  const wrap=document.createElement("div"); wrap.className="gprop";
  wrap.innerHTML = Math.random()<0.7 ? FLOWER_SVG() : ANIMAL_SVG();
  gpropsEl.appendChild(wrap);
  const x = W + 24; wrap.style.transform=`translateX(${x}px)`;
  gprops.push({el:wrap, x});
}
function advanceGProps(d){
  for(let i=gprops.length-1;i>=0;i--){ const g=gprops[i]; g.x-=d; g.el.style.transform=`translateX(${g.x}px)`;
    if(g.x < -50){ g.el.remove(); gprops.splice(i,1); } }
}
function spawnBird(){
  const b=document.createElement("div"); b.className="bird"; b.innerHTML=BIRD_SVG();
  b.style.top=(6+Math.random()*30)+"%";
  const dur=9+Math.random()*6; b.style.animationDuration=dur+"s";

// old = 그때의 차가운 로그 / fix = 회차를 살아낸 지금의 재해석. 앞에서부터 lookback 개수만큼 열린다.
const SYS_REINTERP=[

let lastSys="";
function pickSys(){
  const learned=learnedCount();
  for(let i=0;i<6;i++){
    let line;
    if(learned>0 && Math.random() < Math.min(0.6, 0.15+learned*0.07)){
      line = (Math.random()<0.5 && SYS_NAMED()) || SYS_WARM[(Math.random()*SYS_WARM.length)|0];
    } else {
      line = SYS_COLD[(Math.random()*SYS_COLD.length)|0];
    }
    if(line && line!==lastSys){ lastSys=line; return line; }
  }
  return SYS_COLD[0];
}
function pickReinterp(){                              // 되돌아본 기억 중 하나(앞에서부터 lookback개만 열림)
  const max=Math.min(S.lookback, SYS_REINTERP.length);
  if(max<=0) return null;
  return SYS_REINTERP[(Math.random()*max)|0];
}
function emitSys(){
  if(!syslogEl || curPage!=="walk" || !S.named) return;
  if(document.getElementById('intro')?.classList.contains('show')) return;
  if(document.getElementById('prestige')?.classList.contains('show')) return;
  const div=document.createElement('div'); div.className='syslog-line';
  // 회차를 산 뒤(cycle≥1)·되돌아본 기억이 있으면(lookback>0) 가끔 옛 로그를 줄 긋고 다시 읽는다
  const rein = (S.cycle>=1 && S.lookback>0 && Math.random()<0.42) ? pickReinterp() : null;
  if(rein){
    div.classList.add('reinterp');
    div.innerHTML = `<span class="struck">${rein.old}</span><span class="rewrite"><span class="pen">✎</span>${rein.fix}</span>`;
  } else {
    const text=pickSys();
    const m=text.match(/^(\[[^\]]+\])\s*([\s\S]*)$/);    // 앞 [태그]는 차갑게, 나머지는 기본
    div.innerHTML = m ? `<span class="pre">${m[1]}</span> ${m[2]}` : text;
  }
  syslogEl.appendChild(div);
  requestAnimationFrame(()=>div.classList.add('in'));
  if(syslogEl.children.length>3){ const old=syslogEl.firstElementChild;
    old.classList.add('out'); setTimeout(()=>old.remove(),800); }
  setTimeout(()=>{ if(div.isConnected){ div.classList.add('out'); setTimeout(()=>div.remove(),800); } }, 13000);
}

setInterval(()=>{ S.walks += S.rate*0.1; elWalks.textContent=fmt(S.walks); syncSteps();
  if(updateDiscovered() && curPage==="map"){ renderEdges(); renderNodes(); placeRobot(); } }, 100);

/* ---------- 줌 입력 ---------- */
document.getElementById('zin').addEventListener('click', ()=>setZoom(zoom*1.25));
document.getElementById('zout').addEventListener('click', ()=>setZoom(zoom/1.25));
map.addEventListener('wheel', e=>{ if(e.ctrlKey){ e.preventDefault(); setZoom(zoom*(e.deltaY<0?1.12:0.9)); } }, {passive:false});
let pinch=null;
const tdist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
map.addEventListener('touchstart', e=>{ if(e.touches.length===2){ pinch={d:tdist(e.touches), z:zoom}; window.__pinch=true; } }, {passive:true});
map.addEventListener('touchmove', e=>{ if(pinch&&e.touches.length===2) setZoom(pinch.z * tdist(e.touches)/pinch.d); }, {passive:true});
map.addEventListener('touchend', e=>{ if(e.touches.length<2){ pinch=null; window.__pinch=false; } });

/* ---------- 페이지 전환 (거지키우기식: 길 ↔ 지도) ---------- */
let curPage = "walk";
function showPage(name){
  curPage = name;
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active", p.id==="page"+name[0].toUpperCase()+name.slice(1)));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.page===name));
  if(name==="map"){ renderAll(); centerOn(S.current); }   // 숨어있던 지도 → 표시될 때 치수 잡고 렌더
  else if(name==="walk"){ setTimeout(emitSys, 400); }     // 길로 돌아오면 곧 상태 로그 한 줄
}
document.querySelectorAll(".tab").forEach(t=> t.addEventListener("click", ()=>showPage(t.dataset.page)) );

/* ---------- 시작 ---------- */
window.addEventListener("resize", ()=>{ if(curPage==="map"){ renderAll(); centerOn(S.current); } });
bootSave();             // 세이브 불러오기(+오프라인 적립)
refreshHUD();           // 길 페이지 먼저 보이므로 HUD/온도만 갱신 (지도는 진입 시 렌더)
initAuth();             // 구글 로그인 초기화(세션 복원/버튼)
</script>
</body>
</html>
