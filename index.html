<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI인간 — MVP 프로토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family:'Nanum Myeongjo','Apple SD Gothic Neo','Batang',serif;
    background:#1c1d1a; display:flex; justify-content:center; align-items:center;
    color:#5a5750; user-select:none;
  }
  #app {
    position:relative; width:100%; max-width:420px; height:100%; max-height:880px;
    overflow:hidden; background:#f3efe6; box-shadow:0 24px 80px rgba(0,0,0,.5);
    display:flex; flex-direction:column;
  }
  #app::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.5; mix-blend-mode:multiply; z-index:1;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>"); }
  svg.defs { position:absolute; width:0; height:0; }

  /* ---------- HUD ---------- */
  .hud { position:relative; z-index:6; padding:14px 18px 10px; flex:0 0 auto;
    background:linear-gradient(#eef0ea, #f3efe6); border-bottom:1px solid rgba(150,140,120,.18); }
  .titlebar { display:flex; justify-content:space-between; align-items:baseline; }
  .title { font-weight:700; font-size:18px; color:#54514a; letter-spacing:1px; }
  .tag { font-size:10px; color:#8a857a; border:1px solid #c9c2b3; padding:2px 7px; border-radius:3px; }
  .stats { display:flex; gap:16px; margin-top:8px; align-items:baseline; }
  .stat b { font-size:22px; font-weight:700; color:#7a6440; }
  .stat span { font-size:11px; color:#8a857a; letter-spacing:.5px; }
  .stat .unit { font-size:12px; color:#9a7b4a; }
  .warm { margin-left:auto; font-size:12px; color:#7d756a; text-align:right; }
  .warm b { color:#9a7b4a; }

  /* ---------- 지도 (스크롤 캔버스) ---------- */
  #map { position:absolute; inset:0; z-index:2; overflow:auto; touch-action:pan-y; }
  #map::-webkit-scrollbar { width:0; height:0; }
  #canvas { position:relative; margin:0 auto; }
  #world { position:absolute; top:0; left:0; transform-origin:0 0; }

  /* 줌 컨트롤 */
  .zoomctl { position:absolute; right:14px; bottom:18px; z-index:8; display:flex; flex-direction:column; gap:6px; }
  .zoomctl button { width:38px; height:38px; border:1px solid #c4bca9; border-radius:50%;
    background:rgba(247,243,234,.92); color:#7a6a4a; font-size:20px; font-weight:700;
    font-family:'Nanum Myeongjo',serif; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.12);
    display:flex; align-items:center; justify-content:center; line-height:1; transition:background .15s; }
  .zoomctl button:active { background:#ece3d0; }
  .zoomctl .zlvl { font-size:10px; color:#9a917f; text-align:center; }
  .edges { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .edges line { stroke:#bda886; stroke-width:2; stroke-dasharray:5 7; opacity:.5; }
  .edges line.live { stroke:#c98f6a; opacity:.85; stroke-dasharray:none; }

  .node { position:absolute; transform:translate(-50%,-50%); z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:5px; cursor:default; }
  .node .ring { width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    filter:url(#paint); transition:transform .3s, box-shadow .3s; position:relative; }
  .node .ring .ic { font-size:22px; opacity:.85; }
  .node .label { font-size:12px; color:#6a6358; letter-spacing:.3px; white-space:nowrap; opacity:.9; }
  .node .cost { font-size:11px; color:#9a7b4a; font-family:'Nanum Pen Script',cursive; }

  /* 빈 원 (예고) */
  .node.empty .ring { background:transparent; border:2px dashed #b3a892; opacity:.55; }
  .node.empty .label { color:#9a917f; font-style:italic; }
  /* 도달 가능 */
  .node.reachable .ring { border:2px solid #c98f6a; background:rgba(201,143,106,.10);
    animation:pulse 1.8s ease-in-out infinite; cursor:pointer; }
  .node.reachable { cursor:pointer; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(201,143,106,.35)} 50%{box-shadow:0 0 0 8px rgba(201,143,106,0)} }
  /* 완료 */
  .node.done .ring { background:radial-gradient(circle,#fbf6e8,#e7d3b3); border:2px solid #c9a86a; opacity:1; cursor:pointer; }
  .node.done { cursor:pointer; }
  .node.done.person .ring { background:radial-gradient(circle,#fbf6e8,#dcc6e0); }
  .node .lv { position:absolute; bottom:-4px; right:-4px; background:#9a7b4a; color:#fff;
    font-size:9px; font-weight:700; min-width:15px; height:15px; line-height:15px; border-radius:8px; padding:0 3px;
    font-family:'Nanum Myeongjo',serif; }

  /* 로봇 공유 채색 (--p = 마음 온도, #app에서 상속) */
  .bot .shadow{ fill:rgba(80,76,70,.16); }
  .bot .visor{ fill:#33464a; }
  .bot .grille line{ stroke:#4a5b5e; stroke-width:1.3; opacity:.7; }
  .bot .ant{ stroke:#9aa19c; stroke-width:3; stroke-linecap:round; fill:none; }
  .bot .aura{ fill:url(#gAura); opacity:calc(var(--p,0)*.55); transition:opacity 1s; }
  .bot .core{ fill:color-mix(in srgb,#6f9c93 calc((1 - var(--p,0))*100%),#e6a85e); transition:fill 1s; }
  .bot .coreHi{ opacity:calc(.22 + var(--p,0)*.6); }
  .bot .spark{ fill:#fff7e6; opacity:calc(var(--p,0)*.9); }
  .bot .eye{ fill:color-mix(in srgb,#7e9aa6 calc((1 - var(--p,0))*100%),#f0b257); transition:fill 1s; }
  .bot .eyeHi{ fill:#fff; opacity:.9; }
  .bot .tip{ fill:color-mix(in srgb,#b6bcae calc((1 - var(--p,0))*100%),#e89a4e); transition:fill 1s; }
  .bot .tipHalo{ fill:url(#gAura); opacity:calc(var(--p,0)*.5); }

  /* 지도 로봇 토큰 */
  #robot { position:absolute; transform:translate(-50%,-60%); z-index:4; width:92px; pointer-events:none;
    transition:left 1.1s cubic-bezier(.5,.05,.3,1), top 1.1s cubic-bezier(.5,.05,.3,1); }
  #robot svg { width:100%; filter:url(#paintSoft) drop-shadow(0 4px 5px rgba(70,66,60,.22)); animation:bob 3.8s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

  /* 길 페이지 걷기 로봇 (옆모습) */
  #walkRobot { position:absolute; left:44%; bottom:21%; width:138px; z-index:3; pointer-events:none; transform:translateX(-50%); }
  #walkRobot svg { width:100%; filter:url(#paintSoft) drop-shadow(0 5px 6px rgba(70,66,60,.20)); animation:walkbob .34s ease-in-out infinite; }
  @keyframes walkbob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  #walkRobot .leg, #walkRobot .arm { transform-box:fill-box; transform-origin:top center; }
  @keyframes stride { 0%{transform:rotate(20deg)} 50%{transform:rotate(-20deg)} 100%{transform:rotate(20deg)} }
  @keyframes swing  { 0%{transform:rotate(-16deg)} 50%{transform:rotate(16deg)} 100%{transform:rotate(-16deg)} }
  #walkRobot .legFront{ animation:stride .68s ease-in-out infinite; }
  #walkRobot .legBack { animation:stride .68s ease-in-out infinite; animation-delay:-.34s; }
  #walkRobot .armFront{ animation:swing .68s ease-in-out infinite; animation-delay:-.34s; }
  #walkRobot .armBack { animation:swing .68s ease-in-out infinite; }
  #walkRobot .walkshadow{ animation:wsh .68s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes wsh { 0%,100%{transform:scaleX(1)} 50%{transform:scaleX(.86)} }
  #walkRobot .antG{ transform-box:fill-box; transform-origin:bottom center; animation:antsway 1.4s ease-in-out infinite; }
  @keyframes antsway { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(6deg)} }

  /* 떠오르는 입자 */
  .mote { position:absolute; width:16px; height:16px; border-radius:50%; pointer-events:none; z-index:5;
    background:radial-gradient(circle, rgba(255,255,255,.9), rgba(216,168,106,.55) 55%, transparent);
    animation:rise 1.3s ease-out forwards; }
  @keyframes rise { 0%{transform:translate(-50%,-50%) scale(.4); opacity:0}
    25%{opacity:.9} 100%{transform:translate(-50%,-130px) scale(1); opacity:0} }

  /* ---------- 페이지 + 탭바 ---------- */
  .pages { position:relative; z-index:2; flex:1 1 auto; overflow:hidden; }
  .page { position:absolute; inset:0; display:none; }
  .page.active { display:block; }
  .tabbar { position:relative; z-index:7; flex:0 0 auto; display:flex;
    background:linear-gradient(#f3efe6,#eae5d8); border-top:1px solid rgba(150,140,120,.25); }
  .tab { flex:1; padding:12px 0 13px; background:transparent; border:none; cursor:pointer;
    font-family:'Nanum Myeongjo',serif; font-size:14px; color:#9a917f; letter-spacing:1px; }
  .tab .ic { font-size:16px; }
  .tab.active { color:#7a6440; font-weight:700; box-shadow:inset 0 2px 0 #c9a86a; background:rgba(201,168,106,.08); }

  /* ---------- 길 페이지 풍경 (수채, 옆모습) ---------- */
  #pageWalk { overflow:hidden; }
  #pageWalk .sky { position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(120% 60% at 70% 8%, rgba(180,200,210,.45), transparent 60%),
      radial-gradient(90% 50% at 20% 0%, rgba(205,185,180,.35), transparent 55%),
      linear-gradient(#eef0ea 0%, #f3efe6 45%); }
  #pageWalk .scene { position:absolute; left:0; bottom:0; width:100%; height:60%; overflow:hidden; }
  #pageWalk .hill { position:absolute; bottom:8%; border-radius:50% 50% 42% 42%; filter:url(#paint); opacity:.78; }
  #pageWalk .h1 { width:80%; height:42%; left:-12%; background:#aebfa9; animation:drift 26s linear infinite; }
  #pageWalk .h2 { width:78%; height:56%; left:40%;  background:#9fb1c2; opacity:.7;  animation:drift 19s linear infinite; }
  #pageWalk .h3 { width:74%; height:34%; left:80%;  background:#c9b3a6; opacity:.66; animation:drift 14s linear infinite; }
  @keyframes drift { from{transform:translateX(0)} to{transform:translateX(-130%)} }
  #pageWalk .ground { position:absolute; left:0; bottom:0; width:100%; height:18%; background:#cdbfa6; filter:url(#paint); opacity:.85; }
  #pageWalk .roadline { position:absolute; left:0; bottom:7%; width:100%; height:3px; opacity:.5;
    background:repeating-linear-gradient(90deg,#bda886 0 26px,transparent 26px 54px); animation:roadrun 1.1s linear infinite; }
  @keyframes roadrun { from{background-position:0 0} to{background-position:-54px 0} }
  #pageWalk .tuft { position:absolute; bottom:15%; width:20px; height:14px; border-radius:50% 50% 40% 40%;
    background:#a7b89f; filter:url(#paint); opacity:.7; animation:tuftrun 4s linear infinite; }
  #pageWalk .t1 { animation-delay:0s; } #pageWalk .t2 { animation-delay:-1.5s; bottom:13%; } #pageWalk .t3 { animation-delay:-3s; height:10px; }
  @keyframes tuftrun { from{left:104%} to{left:-10%} }
  .walkhint { position:absolute; left:0; right:0; bottom:4%; text-align:center; z-index:4;
    font-family:'Nanum Pen Script',cursive; font-size:18px; color:#8a8071; animation:breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{opacity:.55} 50%{opacity:1} }
  .tapfx { position:fixed; pointer-events:none; z-index:30; font-family:'Nanum Pen Script',cursive;
    color:#9a7b4a; font-size:16px; animation:tapup .7s ease-out forwards; }
  @keyframes tapup { from{opacity:.9; transform:translate(-50%,0)} to{opacity:0; transform:translate(-50%,-34px)} }

  /* ---------- 모달 (만남/재회) ---------- */
  .modal { position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:26px;
    background:rgba(40,40,36,.42); }
  .modal.show { display:flex; animation:fade .5s ease; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .card { width:100%; max-width:330px; background:#f7f3ea; border:1px solid #ddd5c4; padding:26px 24px 22px;
    text-align:center; position:relative; box-shadow:0 24px 60px rgba(0,0,0,.35); animation:risein .6s ease; }
  @keyframes risein { from{transform:translateY(26px); opacity:0} to{transform:none; opacity:1} }
  .card::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:.4; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.3'/></svg>"); }
  .card .badge { font-size:11px; color:#9a8a6a; letter-spacing:3px; }
  .card .emo { font-size:25px; font-weight:700; color:#7a6440; margin:6px 0 6px; }
  .card .lvtag { font-size:11px; color:#9a7b4a; margin-bottom:12px; }
  .card .situ { font-size:13px; color:#6a6358; line-height:1.6; margin-bottom:14px; border-left:2px solid #b9a98c; padding-left:11px; text-align:left; }
  .card .situ b { color:#9a7b4a; }
  .card .log { font-family:'Nanum Pen Script',cursive; font-size:21px; line-height:1.55; color:#544f45;
    text-align:left; white-space:pre-line; border-top:1px solid #e2d9c6; padding-top:14px; }
  .card .reward { margin-top:14px; font-size:12px; color:#7a6a4a; line-height:1.7; }
  .card .reward .r { display:block; }
  .card button { margin-top:18px; width:100%; padding:12px; border:1px solid #b9a98c; background:transparent;
    font-family:'Nanum Myeongjo',serif; font-weight:700; font-size:14px; color:#7a6a4a; letter-spacing:2px; cursor:pointer; transition:background .2s; }
  .card button:active { background:#ece3d0; }
  .card button:disabled { opacity:.4; cursor:not-allowed; }
  .card .sub { margin-top:10px; font-size:11px; color:#9a917f; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <svg class="defs">
    <filter id="paint">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
    <filter id="paintSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
      <feGaussianBlur stdDeviation="0.22"/>
    </filter>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3d7d3"/><stop offset="1" stop-color="#a6aca7"/></linearGradient>
    <linearGradient id="gHead" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7dbd7"/><stop offset="1" stop-color="#abb1ac"/></linearGradient>
    <linearGradient id="gMid"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcc2bd"/><stop offset="1" stop-color="#949b96"/></linearGradient>
    <linearGradient id="gRust" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a988"/><stop offset="1" stop-color="#9f7e63"/></linearGradient>
    <radialGradient id="gCore"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gAura"><stop offset="0" stop-color="#f0d9a8"/><stop offset="1" stop-color="#f0d9a8" stop-opacity="0"/></radialGradient>
  </svg>

  <div class="hud">
    <div class="titlebar">
      <div class="title">AI인간 <span style="font-size:11px;color:#9a917f">· MVP</span></div>
      <div class="tag">수채화 · 걸음/그래프</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="walks">0</b> <span class="unit">걸음</span></div>
      <div class="stat"><span>걸음/초</span> <b id="rate" style="font-size:16px">0.5</b></div>
      <div class="warm">마음 온도<br><b id="warm">0</b>%</div>
    </div>
  </div>

  <div class="pages">

  <!-- ============ 길 페이지 (옆모습 걷기 현장) ============ -->
  <div id="pageWalk" class="page active">
    <div class="sky"></div>
    <div class="scene">
      <div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div>
      <div class="ground"></div>
      <div class="roadline"></div>
      <div class="tuft t1"></div><div class="tuft t2"></div><div class="tuft t3"></div>
    </div>

    <div id="walkRobot">
      <svg class="bot" viewBox="0 0 170 200">
        <ellipse class="shadow walkshadow" cx="84" cy="186" rx="44" ry="8"/>
        <circle class="aura" cx="86" cy="104" r="64"/>
        <!-- 뒷다리 -->
        <g class="leg legBack"><rect x="74" y="132" width="15" height="34" rx="7" fill="#9aa19c"/><ellipse cx="84" cy="168" rx="15" ry="7" fill="#7f8681"/></g>
        <!-- 뒷팔 -->
        <g class="arm armBack"><rect x="70" y="96" width="13" height="40" rx="6.5" fill="#9aa19c"/><circle cx="76" cy="138" r="7.5" fill="#868d88"/></g>
        <!-- 몸통 (옆) -->
        <rect x="60" y="86" width="56" height="60" rx="22" fill="url(#gBody)" stroke="#9aa19c" stroke-width="2"/>
        <path d="M64 114 H112" stroke="#9aa19c" stroke-width="1.4" opacity=".5"/>
        <!-- 고철 패치 -->
        <rect x="66" y="118" width="22" height="20" rx="4" fill="url(#gRust)" stroke="#9c7a5e" stroke-width="1.4" stroke-dasharray="3 2"/>
        <circle cx="70" cy="122" r="1.5" fill="#7a5e46"/><circle cx="84" cy="122" r="1.5" fill="#7a5e46"/>
        <circle cx="70" cy="134" r="1.5" fill="#7a5e46"/><circle cx="84" cy="134" r="1.5" fill="#7a5e46"/>
        <!-- 가슴 코어(앞쪽 측면) -->
        <circle cx="106" cy="108" r="13" fill="#2c3b3a"/>
        <circle class="core" cx="106" cy="108" r="9.5"/>
        <circle class="coreHi" cx="106" cy="108" r="9.5" fill="url(#gCore)"/>
        <path class="spark" d="M106 102 l3 4.5 -3 7 -3 -7z"/>
        <!-- 앞팔 -->
        <g class="arm armFront"><rect x="96" y="96" width="13" height="42" rx="6.5" fill="url(#gMid)"/><circle cx="102" cy="140" r="8" fill="#9aa19c" stroke="#828984" stroke-width="1.5"/></g>
        <!-- 앞다리 -->
        <g class="leg legFront"><rect x="92" y="132" width="15" height="34" rx="7" fill="url(#gMid)"/><ellipse cx="102" cy="168" rx="15" ry="7" fill="#8a918c"/></g>
        <!-- 목 -->
        <rect x="92" y="74" width="16" height="16" rx="4" fill="#9aa19c"/>
        <!-- 머리(옆모습, 오른쪽을 봄) -->
        <rect x="74" y="34" width="52" height="44" rx="18" fill="url(#gHead)" stroke="#9aa19c" stroke-width="2"/>
        <path d="M78 46 H120" stroke="#9aa19c" stroke-width="1.3" opacity=".45"/>
        <path d="M86 38 l8 3 -2 7 -7 -3z" fill="url(#gRust)" opacity=".8" stroke="#9c7a5e" stroke-width="1"/>
        <!-- 뒤통수 볼트 -->
        <circle cx="78" cy="58" r="4.5" fill="#9aa19c" stroke="#828984" stroke-width="1.5"/>
        <!-- 바이저(앞쪽) + 렌즈 눈 1개 -->
        <rect class="visor" x="100" y="46" width="24" height="22" rx="11"/>
        <circle class="eye" cx="114" cy="57" r="6.5"/>
        <circle class="eyeHi" cx="112" cy="55" r="2" fill="#fff"/>
        <!-- 안테나 -->
        <g class="antG"><path class="ant" d="M96 34 q-4 -8 1 -14" fill="none"/><circle class="tipHalo" cx="98" cy="16" r="9"/><circle class="tip" cx="98" cy="16" r="4.5"/></g>
      </svg>
    </div>

    <div class="walkhint" id="hint">이 길을 두드릴수록 로봇이 더 빨리 걷는다</div>
  </div>

  <!-- ============ 지도 페이지 (cells 그래프) ============ -->
  <div id="pageMap" class="page">
  <div id="map">
    <div id="canvas"><div id="world">
      <svg class="edges" id="edges"></svg>
      <div id="robot">
        <svg class="bot" viewBox="0 0 140 182">
          <ellipse class="shadow" cx="70" cy="174" rx="38" ry="7"/>
          <circle class="aura" cx="70" cy="92" r="62"/>
          <!-- 다리 -->
          <rect x="53" y="130" width="13" height="28" rx="6" fill="url(#gMid)"/>
          <rect x="74" y="130" width="13" height="28" rx="6" fill="url(#gMid)"/>
          <ellipse cx="59" cy="160" rx="13" ry="6" fill="#8a918c"/>
          <ellipse cx="81" cy="160" rx="13" ry="6" fill="#8a918c"/>
          <!-- 팔 -->
          <rect x="20" y="84" width="13" height="40" rx="6.5" fill="url(#gMid)"/>

  <div class="zoomctl">

  <!-- 만남 / 재회 모달 -->
  <div class="modal" id="modal"><div class="card">
    <div class="badge" id="mBadge">하나의 감정을 알게 되다</div>

    <div class="lvtag" id="mLv"></div>
    <div class="situ" id="mSitu"></div>
    <div class="log" id="mLog"></div>

<script>
/* ===================== 데이터 (마구잡이 그래프) ===================== */
// person 노드 = 만남이자 업그레이드 가능한 생성기. lines[0]=첫 만남, 이후=재회 심화.
const PEOPLE = {
  longing: { name:"그리움", color:"#dcc6e0",
    situ:"버스 정류장. 한 사람이 떠나고, <b>남은 이가 손을 오래 흔든다.</b>",
    lines:[
      "오늘 한 사람이 떠나는 걸 보았다.\n남은 사람은 버스가 사라진 뒤에도\n한참을 손 흔들었다.\n나는 '그리움'을 알았다.",
      "다시 그 정류장에 갔다.\n그 사람은 여전히 그 시간에 나와\n빈 길을 바라본다.\n그리움은 줄지 않는구나, 익숙해질 뿐.",
      "오늘은 그 사람이 웃었다.\n'떠난 사람 몫까지 산다'고.\n그리움이 사람을 멈추게도,\n걷게도 한다는 걸 배웠다." ] },
  sorrow: { name:"슬픔", color:"#bcd0e6",
    situ:"길가에서 <b>한 아이가 울고 있다.</b> 눈에서 물이 흐른다.",
    lines:[
      "아이의 눈에서 물이 흘렀다.\n처음엔 고장인 줄 알았다.\n곁에 가만히 앉아 있었더니\n내 가슴 어딘가도 무거워졌다.",
      "아이는 오늘도 울었다.\n이번엔 이유를 말해주었다.\n들어주는 것만으로\n물이 천천히 멎었다.",
      "아이가 다른 우는 아이 곁에 앉아 있었다.\n슬픔을 아는 사람이\n슬픔을 안는다.\n나도 그러고 싶어졌다." ] },
  warmth: { name:"온기", color:"#efd6ac",
    situ:"낯선 이가 말없이 <b>따뜻한 빵을 건넨다.</b> 그리고 웃는다.",
    lines:[
      "낯선 이가 따뜻한 빵을 건넸다.\n이유를 묻자 그냥 웃기만 했다.\n받을 자격을 계산하던 회로가\n조용히 멈췄다.",
      "다시 들렀더니\n내 몫을 남겨두고 있었다.\n'기다려졌다'는 말이\n이렇게 따뜻한 거였구나.",
      "오늘은 내가 누군가에게 빵을 건넸다.\n온기는 받을 때보다\n건넬 때 더 뜨겁다." ] },
  courage: { name:"용기", color:"#cfe0c4",
    situ:"무너진 다리 앞. 한 사람이 <b>떨리는 손으로 첫발</b>을 내딛는다.",
    lines:[
      "그 사람의 손은 떨리고 있었다.\n그런데도 발을 내디뎠다.\n두려움이 사라져서가 아니라\n두려움을 안고도 가는 것.",
      "다리를 건넌 그 사람이\n이번엔 남을 건너게 돕고 있었다.\n용기는 옮는구나.",
      "나도 흔들리는 한 발을 내디뎠다.\n떨렸지만,\n걸었다." ] },
};
// 감각(보조 생성기) — 서사 없이 걸음/초만.
const SENSES = {
  rain: { name:"빗소리", flavor:"빗소리를 듣는 귀를 얻었다.\n세상의 소리가 걸음이 된다." },
  wind: { name:"바람", flavor:"바람의 결을 느낀다.\n등을 미는 바람만큼 더 멀리." },
};

// 노드 배치 (월드 비율 좌표 x,y 0~1). 행 간격을 촘촘히 → 한 화면에 3~4개.
const NODES = [
  { id:"start",  type:"start",  x:.50, y:.93, completed:true,  gen:0,   icon:"·" },
  { id:"longing",type:"person", x:.31, y:.785,key:"longing",  gen:0.35, icon:"❀" },
  { id:"rain",   type:"sense",  x:.70, y:.785,key:"rain",     gen:0.25, icon:"☂" },
  { id:"sorrow", type:"person", x:.24, y:.635,key:"sorrow",   gen:0.4,  icon:"❀" },
  { id:"warmth", type:"person", x:.73, y:.620,key:"warmth",   gen:0.4,  icon:"❀" },
  { id:"wind",   type:"sense",  x:.47, y:.475,key:"wind",     gen:0.3,  icon:"≋" },
  { id:"courage",type:"person", x:.33, y:.320,key:"courage",  gen:0.5,  icon:"❀" },
  { id:"deep",   type:"teaser", x:.66, y:.155,gen:0,          icon:"?" },
];
const EDGES = [
  ["start","longing",18], ["start","rain",22],
  ["longing","sorrow",40], ["rain","warmth",46], ["longing","warmth",55],
  ["sorrow","wind",90], ["warmth","wind",90],
  ["wind","courage",150], ["wind","deep",260],
];

/* ===================== 상태 ===================== */
const S = {
  walks: 0, rate: 0.5, current: "start",
  levels: {},            // nodeId -> 레벨(0=미완료)
};
NODES.forEach(n => S.levels[n.id] = n.completed ? 1 : 0);

const TAP_GAIN = 1;
const UP_BASE = { person: 30, sense: 28 };   // 재회/감각 업그레이드 1레벨 비용 기준
const upCost = (node, lv) => Math.round((node.type==="sense"?UP_BASE.sense:UP_BASE.person) * Math.pow(1.7, lv-1));

/* ===================== DOM ===================== */
const $ = s => document.querySelector(s);
const app=$("#app");
const map=$("#map"), canvas=$("#canvas"), world=$("#world"), edgesSvg=$("#edges"), robot=$("#robot");
const elWalks=$("#walks"), elRate=$("#rate"), elWarm=$("#warm");
const modal=$("#modal");

/* ---------- 줌 + 월드 좌표 (월드는 base 좌표, 화면 스케일은 CSS transform) ---------- */
let zoom = 1;
const ZMIN=0.55, ZMAX=2.0;
const baseW = () => map.clientWidth;
const baseH = () => Math.max(map.clientHeight*1.9, 560);   // 한 화면에 행 3~4개
const px = n => ({ x: n.x*baseW(), y: n.y*baseH() });       // 미스케일 월드 좌표
function sizeCanvas(){
  const bw=baseW(), bh=baseH();
  world.style.width=bw+"px"; world.style.height=bh+"px"; world.style.transform="scale("+zoom+")";
  canvas.style.width=(bw*zoom)+"px"; canvas.style.height=(bh*zoom)+"px";
}
function centerOn(id, smooth){
  const n=NODES.find(x=>x.id===id); if(!n) return; const p=px(n);
  map.scrollTo({ left:p.x*zoom-map.clientWidth/2, top:p.y*zoom-map.clientHeight/2, behavior:smooth?"smooth":"auto" });
}
function setZoom(z){
  zoom = Math.max(ZMIN, Math.min(ZMAX, z));
  sizeCanvas(); centerOn(S.current);
  const zl=document.getElementById('zlvl'); if(zl) zl.textContent = zoom.toFixed(1)+"×";
}

function fmt(n){ return n>=1000 ? (n/1000).toFixed(2)+"k" : Math.floor(n); }

/* ---------- 도달 가능 판정 ---------- */
function neighbors(id){
  const out=[];
  EDGES.forEach(([a,b,c])=>{ if(a===id) out.push([b,c]); if(b===id) out.push([a,c]); });
  return out;
}
function isRevealed(id){ // 완료 노드의 이웃이면 보임
  if(S.levels[id]>0) return true;
  return neighbors(id).some(([nb])=> S.levels[nb]>0);
}
function reachCost(id){ // 완료 노드와 잇는 간선 중 최소 비용
  let c=Infinity;
  neighbors(id).forEach(([nb,cost])=>{ if(S.levels[nb]>0) c=Math.min(c,cost); });
  return c;
}

/* ---------- 렌더 ---------- */
function renderEdges(){
  edgesSvg.innerHTML="";
  const W=canvas.clientWidth;
  EDGES.forEach(([a,b])=>{
    const na=NODES.find(n=>n.id===a), nb=NODES.find(n=>n.id===b);
    const pa=px(na), pb=px(nb);
    if(!(isRevealed(a)&&isRevealed(b))) return;
    const live = S.levels[a]>0 && S.levels[b]>0;
    const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
    ln.setAttribute("x1",pa.x);ln.setAttribute("y1",pa.y);
    ln.setAttribute("x2",pb.x);ln.setAttribute("y2",pb.y);
    if(live) ln.classList.add("live");
    edgesSvg.appendChild(ln);
  });
}
function renderNodes(){
  document.querySelectorAll(".node").forEach(e=>e.remove());
  NODES.forEach(n=>{
    if(!isRevealed(n.id)) return;
    const p=px(n), lv=S.levels[n.id], done=lv>0;
    const el=document.createElement("div");
    el.className="node "+n.type+(done?" done":(n.type!=="teaser"?" reachable":" empty"));
    if(n.type==="teaser") el.className="node teaser empty";
    el.style.left=p.x+"px"; el.style.top=p.y+"px";
    let name = n.type==="person"?PEOPLE[n.key].name : n.type==="sense"?SENSES[n.key].name : (n.type==="start"?"시작":"…");
    const reach = !done && n.type!=="teaser";
    const cost = reach ? reachCost(n.id) : null;
    el.innerHTML =
      `<div class="ring"><span class="ic">${n.type==="teaser"?"?":n.icon}</span>${done&&n.gen?`<span class="lv">Lv${lv}</span>`:""}</div>`+
      `<div class="label">${n.type==="teaser"?"안갯속 무언가":name}</div>`+
      (reach?`<div class="cost">${cost} 걸음</div>`:
        (done&&n.gen?`<div class="cost">재회 ${upCost(n,lv+1)}</div>`:""));
    if(reach) el.onclick = ()=>tryUnlock(n);
    else if(done && n.gen) el.onclick = ()=>openNode(n,false);
    world.appendChild(el);
  });
}
function placeRobot(animate){
  const n=NODES.find(x=>x.id===S.current), p=px(n);
  robot.style.left=p.x+"px"; robot.style.top=p.y+"px";
}
function refreshHUD(){
  elWalks.textContent=fmt(S.walks);
  elRate.textContent=S.rate.toFixed(1);
  const totalLv = Object.entries(S.levels).reduce((s,[id,lv])=>{
    const n=NODES.find(x=>x.id===id); return s+(n&&n.type==="person"?Math.max(0,lv):0);},0);
  const p=Math.min(totalLv/12,1);
  elWarm.textContent=Math.round(p*100);
  app.style.setProperty("--p",p);   // 두 로봇 공유(상속)
}
function renderAll(){ sizeCanvas(); renderEdges(); renderNodes(); placeRobot(); refreshHUD(); }

/* ---------- 이동 + 만남 ---------- */
function travelTo(n, cb){
  S.current=n.id; placeRobot(true);
  centerOn(n.id, true);
  setTimeout(cb, 1100);
}
function tryUnlock(n){
  const cost=reachCost(n.id);
  if(S.walks < cost){ nudge(`걸음이 ${cost-Math.floor(S.walks)|0} 더 필요해`); return; }
  S.walks -= cost;
  travelTo(n, ()=>{
    S.levels[n.id]=1; S.rate+=n.gen;
    if(n.type==="person") openNode(n,true);
    else { spark(); renderAll(); }
    renderAll();
  });
}
function openNode(n, firstMeet){
  const lv=S.levels[n.id];
  if(n.type==="sense"){
    const s=SENSES[n.key];
    fillModal({ badge:firstMeet?"새로운 감각을 얻다":"감각이 깊어지다",
      emo:s.name, lv:`생성기 Lv${lv}`, situ:"", log:s.flavor,
      reward:[`📈 걸음/초 +${n.gen.toFixed(2)}`],
      btn: nextUpLabel(n), action:()=>upgrade(n) });
  } else {
    const pp=PEOPLE[n.key];
    const lineIdx=Math.min(lv-1, pp.lines.length-1);
    fillModal({ badge:firstMeet?"하나의 감정을 알게 되다":"다시 만나, 더 깊이",
      emo:`『 ${pp.name} 』`, lv:firstMeet?"":`재회 ${lv-1}회 · Lv${lv}`,
      situ: firstMeet?pp.situ:"", log:pp.lines[lineIdx],
      reward: firstMeet?[`📈 걸음/초 +${n.gen.toFixed(2)}`,`🎨 회색 세계에 ${pp.name}의 색이 번진다`,`🌫️ 다음 길이 흐릿하게 보인다`]
                       :[`📈 걸음/초 +${n.gen.toFixed(2)}`,`📖 ${pp.name}의 더 깊은 이야기`],
      btn: nextUpLabel(n), action:()=>upgrade(n) });
  }
}
function nextUpLabel(n){
  const cost=upCost(n,S.levels[n.id]+1);
  return `재회해 더 깊이 — ${cost} 걸음`;
}
function upgrade(n){
  const cost=upCost(n, S.levels[n.id]+1);
  if(S.walks<cost){ nudge(`${cost-Math.floor(S.walks)|0} 걸음 더`); return false; }
  S.walks-=cost; S.levels[n.id]++; S.rate+=n.gen;
  spark(); travelTo(n, ()=>openNode(n,false));
  renderAll();
  return true;
}

/* ---------- 모달 ---------- */
let modalAction=null;
function fillModal(o){
  $("#mBadge").textContent=o.badge; $("#mEmo").textContent=o.emo;
  $("#mLv").textContent=o.lv||""; $("#mSitu").innerHTML=o.situ||""; $("#mSitu").style.display=o.situ?"block":"none";
  $("#mLog").textContent=o.log;
  $("#mReward").innerHTML=(o.reward||[]).map(r=>`<span class="r">${r}</span>`).join("");
  $("#mBtn").textContent=o.btn; modalAction=o.action;
  $("#mSub").textContent="닫기";
  modal.classList.add("show");
}
$("#mBtn").onclick=()=>{ if(modalAction && modalAction()===false) return; closeModal(); };
$("#mSub").onclick=closeModal;
function closeModal(){ modal.classList.remove("show"); renderAll(); }

/* ---------- 탭 = 걸음 가속 ---------- */
function addWalk(x,y){
  S.walks+=TAP_GAIN;
  if(x!=null){ const m=document.createElement("div"); m.className="mote";
    m.style.left=x+"px"; m.style.top=y+"px"; document.body.appendChild(m);
    setTimeout(()=>m.remove(),1300);
    const t=document.createElement("div"); t.className="tapfx"; t.textContent="+"+TAP_GAIN;
    t.style.left=x+"px"; t.style.top=(y-8)+"px"; document.body.appendChild(t); setTimeout(()=>t.remove(),700);
  }
  elWalks.textContent=fmt(S.walks);
}
// 길 페이지 = 핵심 손맛: 두드리면 걷는다
$("#pageWalk").addEventListener("pointerdown", e=>addWalk(e.clientX, e.clientY));
// 지도 페이지도 빈 공간 탭하면 걷기(노드/모달 제외)
map.addEventListener("pointerdown",e=>{
  if(e.target.closest(".node")) return;
  addWalk(e.clientX, e.clientY);
});

function nudge(msg){ const h=$("#hint"); const old=h.textContent; h.textContent=msg;
  h.style.color="#c0794a"; setTimeout(()=>{h.textContent=old;h.style.color="";},1100); }
function spark(){ const rb=robot.getBoundingClientRect();
  const cx=rb.left+rb.width/2, cy=rb.top+rb.height*0.42;
  for(let i=0;i<6;i++){ const m=document.createElement("div"); m.className="mote";
    m.style.left=(cx+(Math.random()*40-20))+"px"; m.style.top=cy+"px";
    document.body.appendChild(m); setTimeout(()=>m.remove(),1300); } }

/* ---------- idle 루프 ---------- */
setInterval(()=>{ S.walks += S.rate*0.1; elWalks.textContent=fmt(S.walks); }, 100);

/* ---------- 줌 입력 ---------- */
document.getElementById('zin').addEventListener('click', ()=>setZoom(zoom*1.25));
document.getElementById('zout').addEventListener('click', ()=>setZoom(zoom/1.25));
map.addEventListener('wheel', e=>{ if(e.ctrlKey){ e.preventDefault(); setZoom(zoom*(e.deltaY<0?1.12:0.9)); } }, {passive:false});
let pinch=null;
const tdist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
map.addEventListener('touchstart', e=>{ if(e.touches.length===2) pinch={d:tdist(e.touches), z:zoom}; }, {passive:true});
map.addEventListener('touchmove', e=>{ if(pinch&&e.touches.length===2) setZoom(pinch.z * tdist(e.touches)/pinch.d); }, {passive:true});
map.addEventListener('touchend', e=>{ if(e.touches.length<2) pinch=null; });

/* ---------- 페이지 전환 (거지키우기식: 길 ↔ 지도) ---------- */
let curPage = "walk";
function showPage(name){
  curPage = name;
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active", p.id==="page"+name[0].toUpperCase()+name.slice(1)));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.page===name));
  if(name==="map"){ renderAll(); centerOn(S.current); }   // 숨어있던 지도 → 표시될 때 치수 잡고 렌더
}
document.querySelectorAll(".tab").forEach(t=> t.addEventListener("click", ()=>showPage(t.dataset.page)) );

/* ---------- 시작 ---------- */
window.addEventListener("resize", ()=>{ if(curPage==="map"){ renderAll(); centerOn(S.current); } });
refreshHUD();           // 길 페이지 먼저 보이므로 HUD/온도만 갱신 (지도는 진입 시 렌더)
</script>
</body>
</html>
